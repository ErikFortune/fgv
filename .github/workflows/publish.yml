name: Publish to npm

# One dispatch publishes. `release` and `major` run only on a `publish/<version>` branch cut from
# `release/<major>`; `alpha` runs only on `prerelease`. Each reusable workflow refuses to start on
# any other ref, so choosing the wrong branch in the dispatch dialog fails before anything is built.
#
# npm trusted publishing (OIDC) is bound to this file name: keep the publish jobs reachable only
# through it.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - alpha
          - major

permissions:
  contents: read

# Two dispatches on the same branch would race the same version; the second waits.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    if: ${{ inputs.release_type == 'release' }}
    uses: ./.github/workflows/publish-release-impl.yml
    with:
      release_kind: release
    permissions:
      contents: write # bump commit and per-package tags on publish/<version>
      id-token: write # npm OIDC
      pull-requests: write # follow-up PRs
    secrets: inherit

  publish-major:
    if: ${{ inputs.release_type == 'major' }}
    uses: ./.github/workflows/publish-release-impl.yml
    with:
      release_kind: major
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    secrets: inherit

  publish-alpha:
    if: ${{ inputs.release_type == 'alpha' }}
    uses: ./.github/workflows/publish-alpha-impl.yml
    permissions:
      contents: write # per-package tags on prerelease
      id-token: write # npm OIDC
    secrets: inherit
