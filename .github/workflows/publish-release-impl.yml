name: Publish Release (Implementation)

# Stable and major publishes. Called only from publish.yml (npm trusted publishing is bound to that
# file). Dispatched on refs/heads/publish/<version>, a child of release/<major> cut at its tip.
#
#   guard   no secrets, read-only. Refuses the wrong ref, a policy that does not name the branch's
#           version, a HEAD that is not exactly origin/release/<major>, and a version every package
#           already has on npm. Chooses the npm dist-tag.
#   build   read-only token, no npm credentials. Installs, versions and writes CHANGELOGs, commits
#           the bump locally, rebuilds, tests, and packs one tarball per package. Uploads the
#           tarballs and a git bundle of the bump commit. All third-party install/build/test code
#           runs here, where there is nothing worth stealing.
#   publish environment npm-publish-release, OIDC and a write token. Installs no repository
#           dependencies. Pushes the bump commit first, publishes each tarball with the pinned npm,
#           tags and pushes, then opens the follow-up PRs.
#
# The version policy names the version this run publishes. `rush version --bump` always increments,
# so the build job parks the policy on `<version>-0` and bumps `patch`, which semver resolves to
# exactly `<version>`; that sequence also writes every CHANGELOG from common/changes and deletes the
# consumed change files. The experiment that established it, and the recovery procedure, are in
# .ai/tasks/completed/2026-11/publish-workflow-rework/result.md and
# .ai/notes/orchestrator/branch-migration-checklist.md.

on:
  workflow_call:
    inputs:
      release_kind:
        description: "'release' (any X.Y.Z except X.0.0) or 'major' (X.0.0 only)"
        required: true
        type: string
    secrets:
      GH_USER_NAME:
        required: true
      GH_USER_EMAIL:
        required: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      major: ${{ steps.check.outputs.major }}
      npm_tag: ${{ steps.check.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0

      - name: Guard (ref, version policy, release train, npm)
        id: check
        env:
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Publish guard::$1"; exit 1; }

          case "$GITHUB_REF" in
            refs/heads/publish/*) ;;
            *) fail "a $RELEASE_KIND publish runs only on refs/heads/publish/<version>; this run is on $GITHUB_REF" ;;
          esac
          BRANCH_VERSION="${GITHUB_REF#refs/heads/publish/}"

          # version-policies.json carries // and /* */ comments and trailing commas.
          # shellcheck disable=SC2016 # single quotes: the argument is JavaScript, not shell
          VERSION=$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("common/config/rush/version-policies.json", "utf8")
              .replace(/^\s*\/\/.*$/gm, "")
              .replace(/\/\*[\s\S]*?\*\//g, "")
              .replace(/,(\s*[\]}])/g, "$1");
            const policy = JSON.parse(text).find((p) => p.policyName === "base-utils");
            if (!policy) { console.error("no base-utils version policy"); process.exit(1); }
            console.log(policy.version);
          ') || fail "could not read the base-utils version policy from common/config/rush/version-policies.json"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || fail "a stable publish needs a plain X.Y.Z version policy; base-utils says '$VERSION'"
          [ "$BRANCH_VERSION" = "$VERSION" ] \
            || fail "branch publish/$BRANCH_VERSION names $BRANCH_VERSION but the base-utils version policy says $VERSION"
          MAJOR="${VERSION%%.*}"

          if [ "$RELEASE_KIND" = "major" ]; then
            [ "$VERSION" = "$MAJOR.0.0" ] || fail "release_type major publishes only $MAJOR.0.0; the policy says $VERSION (use release_type release)"
          else
            [ "$VERSION" != "$MAJOR.0.0" ] || fail "$VERSION is a new major; dispatch with release_type major"
          fi

          # The publish child is cut from the train's tip and dispatched straight away, so what is
          # published is exactly what was promoted. Touch-ups go on the child after the run.
          TRAIN_SHA=$(git rev-parse --verify -q "refs/remotes/origin/release/$MAJOR") \
            || fail "the policy major is $MAJOR, but origin/release/$MAJOR does not exist"
          HEAD_SHA=$(git rev-parse HEAD)
          [ "$HEAD_SHA" = "$TRAIN_SHA" ] \
            || fail "publish/$VERSION must be exactly origin/release/$MAJOR ($TRAIN_SHA) when dispatched; it is $HEAD_SHA. Reset the branch to the train and dispatch again; commit touch-ups after the publish."

          node common/scripts/install-run-rush.js list --json --version | sed -n '/^{/,$p' > "$RUNNER_TEMP/projects.json"
          # shellcheck disable=SC2016 # single quotes: the argument is JavaScript, not shell
          node -e '
            const fs = require("fs");
            const names = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).projects
              .filter((p) => p.versionPolicyName === "base-utils").map((p) => p.name);
            fs.writeFileSync(process.argv[2], names.join("\n") + "\n");
          ' "$RUNNER_TEMP/projects.json" "$RUNNER_TEMP/packages.txt"
          [ -s "$RUNNER_TEMP/packages.txt" ] || fail "rush lists no base-utils projects"

          # Refuse only when every package already has VERSION, so a run that stopped part-way can be
          # finished: the publish job skips what npm already has.
          TOTAL=0; DONE=0
          while read -r NAME; do
            TOTAL=$((TOTAL + 1))
            if OUT=$(npm view "$NAME" versions --json 2>&1); then
              if OUT="$OUT" node -e 'process.exit([].concat(JSON.parse(process.env.OUT)).includes(process.argv[1]) ? 0 : 1)' "$VERSION"; then
                DONE=$((DONE + 1))
              fi
            elif ! grep -q E404 <<<"$OUT"; then
              fail "could not read the published versions of $NAME from npm: $OUT"
            fi
          done < "$RUNNER_TEMP/packages.txt"
          [ "$DONE" -lt "$TOTAL" ] || fail "all $TOTAL base-utils packages are already on npm at $VERSION; nothing to publish"
          if [ "$DONE" -gt 0 ]; then
            echo "::warning title=Partial publish::$DONE of $TOTAL packages are already on npm at $VERSION; this run publishes the rest"
          fi

          # A maintenance-train release older than npm's latest must not move `latest` backwards.
          LATEST=$(npm view @fgv/ts-utils dist-tags.latest) || fail "could not read the latest dist-tag of @fgv/ts-utils"
          # shellcheck disable=SC2016 # single quotes: the argument is JavaScript, not shell
          OLDER=$(node -e '
            const core = (v) => v.split("-")[0].split(".").map(Number);
            const [a, b] = [core(process.argv[1]), core(process.argv[2])];
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            console.log(cmp < 0 ? "yes" : "no");
          ' "$VERSION" "$LATEST")
          if [ "$OLDER" = "yes" ]; then NPM_TAG="release-$MAJOR"; else NPM_TAG="latest"; fi

          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Guards passed: $RELEASE_KIND $VERSION on $GITHUB_REF = origin/release/$MAJOR; $DONE/$TOTAL already on npm; npm latest is $LATEST, dist-tag $NPM_TAG."

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      MAJOR: ${{ needs.guard.outputs.major }}
    outputs:
      bump_sha: ${{ steps.commit.outputs.bump_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Git config user
        env:
          GH_USER_NAME: ${{ secrets.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}
        run: |
          git config user.name "$GH_USER_NAME"
          git config user.email "$GH_USER_EMAIL"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0

      - name: Verify Change Logs
        run: node common/scripts/install-run-rush.js change --verify --target-branch "origin/release/${MAJOR}"

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      # Writes the version policy, every package.json, CHANGELOG.json and CHANGELOG.md, and deletes
      # the consumed change files. Leaves the policy at $VERSION with nextBump unchanged.
      - name: Version and changelogs
        run: |
          set -euo pipefail
          node common/scripts/install-run-rush.js version --ensure-version-policy --version-policy base-utils --override-version "$VERSION-0"
          node common/scripts/install-run-rush.js version --bump --version-policy base-utils --override-bump patch
          node common/scripts/install-run-rush.js list --json --version | sed -n '/^{/,$p' > "$RUNNER_TEMP/projects.json"
          # shellcheck disable=SC2016 # single quotes: the argument is JavaScript, not shell
          node -e '
            const fs = require("fs");
            const projects = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).projects
              .filter((p) => p.versionPolicyName === "base-utils");
            const wrong = projects.filter((p) => p.version !== process.env.VERSION);
            if (projects.length === 0 || wrong.length > 0) {
              console.error(`expected every base-utils project at ${process.env.VERSION}; wrong: ` +
                wrong.map((p) => `${p.name}@${p.version}`).join(", "));
              process.exit(1);
            }
            fs.writeFileSync(process.argv[2], projects.map((p) => `${p.name}\t${p.path}`).join("\n") + "\n");
          ' "$RUNNER_TEMP/projects.json" "$RUNNER_TEMP/projects.tsv"
          echo "$(wc -l < "$RUNNER_TEMP/projects.tsv") packages at $VERSION"

      # Committed before the build so the build, the tests and the tarballs all come from this commit.
      # --no-verify: the pre-commit hook would run prettier over the files rush just wrote.
      - name: Commit the bump
        id: commit
        run: |
          set -euo pipefail
          git add -A -- common/config/rush/version-policies.json common/changes \
            ':(glob)**/package.json' ':(glob)**/CHANGELOG.json' ':(glob)**/CHANGELOG.md'
          git commit --no-verify -m "Publish $VERSION"
          git status --porcelain
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose

      - name: Rush test
        run: node common/scripts/install-run-rush.js test --verbose

      # The publish-time hard gate. Every path a manifest names must be present in the tarball
      # this publish would upload — @fgv 5.1.0-27 shipped only `src/`, and no tree-based
      # check could see it. Runs immediately before the pack so it reads the same tree.
      # Costs ~5 s across the repo, against ~3.3 min for `npm pack --dry-run` per package.
      - name: Install pack-check autoinstaller
        run: node common/scripts/install-run-rush.js install-autoinstaller --name rush-pack-check
      - name: Verify exports resolve inside the published tarball
        run: node common/scripts/verify-tarball-exports.mjs --verbose --timing

      # The same `pnpm pack` rush runs per project, which resolves workspace: ranges to $VERSION.
      # Each tarball is checked for the version and for any workspace: range left unresolved.
      - name: Pack tarballs and bundle the bump commit
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT/tarballs"
          PNPM="$PWD/common/temp/pnpm-local/node_modules/.bin/pnpm"
          : > "$OUT/tarballs.tsv"
          while IFS=$'\t' read -r NAME DIR; do
            FILE=$(cd "$DIR" && "$PNPM" pack --pack-destination "$OUT/tarballs" | tail -1)
            FILE=$(basename "$FILE")
            # shellcheck disable=SC2016 # single quotes: the argument is JavaScript, not shell
            tar -xzOf "$OUT/tarballs/$FILE" package/package.json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const p = JSON.parse(s);
                const bad = ["dependencies", "peerDependencies", "optionalDependencies"]
                  .flatMap((k) => Object.entries(p[k] ?? {})).filter(([, r]) => String(r).startsWith("workspace:"));
                if (p.name !== process.argv[1] || p.version !== process.argv[2] || bad.length > 0) {
                  console.error(`${process.argv[1]}: tarball says ${p.name}@${p.version}, unresolved: ${JSON.stringify(bad)}`);
                  process.exit(1);
                }
              });
            ' "$NAME" "$VERSION"
            printf '%s\t%s\n' "$NAME" "$FILE" >> "$OUT/tarballs.tsv"
          done < "$RUNNER_TEMP/projects.tsv"
          [ "$(wc -l < "$OUT/tarballs.tsv")" = "$(wc -l < "$RUNNER_TEMP/projects.tsv")" ]
          git bundle create "$OUT/bump.bundle" HEAD ^HEAD~1
          git rev-parse HEAD > "$OUT/bump-sha"
          echo "$(wc -l < "$OUT/tarballs.tsv") tarballs at $VERSION"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ needs.guard.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment: npm-publish-release
    permissions:
      contents: write # bump commit and per-package tags on publish/<version>
      id-token: write # npm OIDC
      pull-requests: write # follow-up PRs
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      MAJOR: ${{ needs.guard.outputs.major }}
      NPM_TAG: ${{ needs.guard.outputs.npm_tag }}
      BUMP_SHA: ${{ needs.build.outputs.bump_sha }}
    steps:
      - name: Locate the release artifact
        run: echo "REL=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Git config user
        env:
          GH_USER_NAME: ${{ secrets.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}
        run: |
          git config user.name "$GH_USER_NAME"
          git config user.email "$GH_USER_EMAIL"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.21.2 && npm --version

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ needs.guard.outputs.version }}
          path: ${{ runner.temp }}/release

      # Pushed before anything reaches npm, so a failure later never leaves npm holding a version
      # the repository has no commit for. Idempotent on a re-run. Credentials exist for this
      # command only.
      - name: Push the bump commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch -q "$REL/bump.bundle" HEAD
          [ "$(git rev-parse FETCH_HEAD)" = "$BUMP_SHA" ] || { echo "::error::bundle holds $(git rev-parse FETCH_HEAD), build reported $BUMP_SHA"; exit 1; }
          [ "$(git rev-parse FETCH_HEAD^)" = "$GITHUB_SHA" ] || { echo "::error::the bump commit's parent is not the dispatched commit $GITHUB_SHA"; exit 1; }
          git branch -f publish-bump FETCH_HEAD
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$REMOTE" = "$BUMP_SHA" ]; then
            echo "origin/$GITHUB_REF_NAME already holds the bump commit"
          else
            AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push origin "$BUMP_SHA:refs/heads/$GITHUB_REF_NAME"
          fi

      # Tarballs only: no repository code runs here. A version already on npm is skipped, so a
      # re-run finishes a partial publish.
      - name: Publish to npm
        run: |
          set -euo pipefail
          cd "$REL/tarballs"
          while IFS=$'\t' read -r NAME FILE; do
            if OUT=$(npm view "$NAME" versions --json 2>&1) \
              && OUT="$OUT" node -e 'process.exit([].concat(JSON.parse(process.env.OUT)).includes(process.argv[1]) ? 0 : 1)' "$VERSION"; then
              echo "Skip $NAME@$VERSION: already on npm"
              continue
            fi
            npm publish "./$FILE" --access public --tag "$NPM_TAG" --ignore-scripts
          done < "$REL/tarballs.tsv"

      - name: Tag and push tags
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW=()
          while IFS=$'\t' read -r NAME _; do
            TAG="${NAME}_v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already on origin"
              continue
            fi
            git tag -f -a "$TAG" -m "$NAME v$VERSION" "$BUMP_SHA"
            NEW+=("refs/tags/$TAG")
          done < "$REL/tarballs.tsv"
          if [ "${#NEW[@]}" -gt 0 ]; then
            AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "${NEW[@]}"
          fi
          WANT=$(wc -l < "$REL/tarballs.tsv")
          HAVE=$(git ls-remote --tags origin "refs/tags/@fgv/*_v$VERSION" | wc -l)
          [ "$HAVE" = "$WANT" ] || { echo "::error::$HAVE tags for $VERSION on origin, expected $WANT"; exit 1; }
          echo "$HAVE tags for $VERSION on origin"

      - name: Open follow-up PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          TRAIN="release/$MAJOR"

          URL=$(gh pr list --base "$TRAIN" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --base "$TRAIN" --head "$BRANCH" \
              --title "Publish $VERSION: merge $BRANCH into $TRAIN" \
              --body "Published $VERSION to npm (dist-tag \`$NPM_TAG\`) from \`$BRANCH\` (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). This carries the bump commit: version policy, package.json versions, CHANGELOGs and the consumed change files.

          **Merge with a merge commit, never squash**, so the published commit and its per-package tags stay in \`$TRAIN\`'s history. Then merge the back-merge PR into \`main\`.")
          fi
          echo "publish_pr=$URL" >> "$GITHUB_OUTPUT"

          git fetch --quiet origin main "$TRAIN"
          AHEAD=$(git rev-list --count "origin/main..origin/$TRAIN")
          if [ "$AHEAD" = "0" ]; then
            COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$TRAIN?expand=1"
            echo "::warning title=Back-merge PR not opened::$TRAIN has no commits ahead of main yet. Merge $URL first, then open $COMPARE"
            echo "backmerge_pr=not opened yet — after merging the publish PR, open $COMPARE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BACK=$(gh pr list --base main --head "$TRAIN" --state open --json url --jq '.[0].url // empty')
          if [ -z "$BACK" ]; then
            BACK=$(gh pr create --draft --base main --head "$TRAIN" \
              --title "Merge back $TRAIN into main after $VERSION" \
              --body "Back-merge after publishing $VERSION. Wait for $URL to merge into \`$TRAIN\`, then mark ready and **merge with a merge commit**. Without it \`main\` keeps the consumed change files and the old version policy.")
          fi
          echo "backmerge_pr=$BACK" >> "$GITHUB_OUTPUT"

      - name: Bundle the bump commit and tags for recovery
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery"
          git rev-parse -q --verify refs/heads/publish-bump >/dev/null || { echo "no bump commit fetched"; exit 0; }
          mapfile -t TAGS < <(git tag -l "@fgv/*_v$VERSION")
          git bundle create "$RUNNER_TEMP/recovery/publish-$VERSION.bundle" refs/heads/publish-bump "${TAGS[@]/#/refs/tags/}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: recovery-${{ needs.guard.outputs.version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery
          if-no-files-found: ignore

      - name: Run summary
        if: always()
        env:
          PUBLISH_PR: ${{ steps.prs.outputs.publish_pr }}
          BACKMERGE_PR: ${{ steps.prs.outputs.backmerge_pr }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Publish $VERSION ($JOB_STATUS)"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`, bump commit \`$BUMP_SHA\`"
            if [ "$NPM_TAG" = "latest" ]; then
              echo "- npm dist-tag: \`latest\`"
            else
              echo "- npm dist-tag: \`$NPM_TAG\` — **not \`latest\`**: $VERSION is older than npm's current latest"
            fi
            echo "- Publish PR: ${PUBLISH_PR:-not opened}"
            echo "- Back-merge PR: ${BACKMERGE_PR:-not opened}"
            echo
            echo "### Packages"
            if [ -f "$REL/tarballs.tsv" ]; then
              cut -f1 "$REL/tarballs.tsv" | sed "s/.*/- \`&@$VERSION\`/"
            else
              echo "_No tarball manifest; the build job did not complete._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
