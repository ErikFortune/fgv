name: Publish Alpha (Implementation)

# Alpha publishes from `prerelease`. Called only from publish.yml (npm trusted publishing is bound to
# that file). Publishes every base-utils package at its committed package.json version
# (`<next minor>.0-N`, bumped on `prerelease` beforehand) under the `alpha` dist-tag, tags each
# `<package>_v<version>-alpha`, and pushes the tags. With --include-all rush ignores change files and
# --apply, so nothing is committed; a version already on npm is skipped.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish-alpha
    permissions:
      id-token: write # npm OIDC
      contents: write # per-package tags on prerelease
    steps:
      - name: Guard (ref)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/prerelease" ]; then
            echo "::error title=Publish guard::an alpha publish runs only on refs/heads/prerelease; this run is on $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Git config user
        env:
          GH_USER_NAME: ${{ secrets.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}
        run: |
          git config user.name "$GH_USER_NAME"
          git config user.email "$GH_USER_EMAIL"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.21.2 && npm --version

      - name: Verify Change Logs
        run: node common/scripts/install-run-rush.js change --verify --target-branch "origin/${GITHUB_REF_NAME}"

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose

      # The publish-time hard gate. Every path a manifest names must be present in the tarball
      # this publish would upload — @fgv 5.1.0-27 shipped only `src/`, and no tree-based
      # check could see it. Runs immediately before publish so it reads the same tree npm
      # packs. Costs ~5 s across the repo, against ~3.3 min for `npm pack --dry-run` per package.
      - name: Install pack-check autoinstaller
        run: node common/scripts/install-run-rush.js install-autoinstaller --name rush-pack-check
      - name: Verify exports resolve inside the published tarball
        run: node common/scripts/verify-tarball-exports.mjs --verbose --timing

      - name: Rush Publish
        run: node common/scripts/install-run-rush.js publish --apply --publish --include-all --set-access-level public --target-branch "${GITHUB_REF_NAME}" --add-commit-details --ignore-git-hooks --tag alpha --prerelease-name alpha
