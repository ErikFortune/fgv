name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'release', 'prerelease', 'hotfix']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config user
        uses: snow-actions/git-config-user@v1.0.0
        with:
          name: ErikFortune
          email: ErikFortune@outlook.com
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Verify Change Logs
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="main"
          fi
          node common/scripts/install-run-rush.js change --verify --target-branch origin/$TARGET_BRANCH
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose
      - name: Rush test
        run: node common/scripts/install-run-rush.js test --verbose
      # Runs after rebuild because it loads built artifacts. Neither the build nor the test step
      # can see this class of defect: TypeScript resolves types either way, and Jest runs in CJS so
      # it never enters the `import` condition. See the script header.
      - name: Verify ESM entry points are loadable
        run: node common/scripts/verify-esm-entrypoints.mjs --verbose
      # The sibling check, one row down the consumer table. The step above asks whether Node can
      # load the entry; this one asks whether a browser bundler can compile it. Nothing else in CI
      # reads that row, and routing browser bundlers at the ESM emit makes it load-bearing.
      - name: Install bundler-check autoinstaller
        run: node common/scripts/install-run-rush.js install-autoinstaller --name rush-bundler-check
      - name: Verify browser entry points bundle
        run: node common/scripts/verify-bundler-resolution.mjs --verbose --measure
      # Both steps above check the working tree. This one checks the tarball npm would actually
      # publish — the only one of the three that can see a package whose build output never enters
      # the pack (the @fgv 5.1.0-27 shape). Per-PR placement is affordable because the whole repo
      # costs ~5 s. The hard gate is in the publish workflows; this is the fast feedback.
      - name: Install pack-check autoinstaller
        run: node common/scripts/install-run-rush.js install-autoinstaller --name rush-pack-check
      - name: Verify exports resolve inside the published tarball
        run: node common/scripts/verify-tarball-exports.mjs --verbose --timing
