  - >
    ONE README CLAIM IS NOW FALSE AGAINST SOURCE, and it was falsified by the cluster's
    own promotion PR. `README.md:20` describes the drift instrumentation as including
    "a length-capped payload preview (200 chars, `<no payload>` for empty data)". Current
    `streamingAdapters/common.ts` defaults to a **structural-only** preview — top-level
    JSON keys plus byte length, never values — with the raw 200-char form opt-in behind
    `AI_ASSIST_UNRECOGNIZED_EVENT_FULL_PAYLOAD`. Per the closeout sub-stream's record the
    change was a PII fix taken on #459 (Copilot round 2), i.e. after the README prose was
    written and before the code reached `release`; `LIBRARY_CAPABILITIES.md` already
    documents the shipped behavior. Surfaced here rather than amended — this backfill ran
    steps 1, 2 and 4 only, and the README amendment is a step-6 action left for the owner.
  - >
    DEFERRALS — all five README followups are durably recorded in `docs/FUTURE.md`, but
    two of the five entries are now STALE IN THE OTHER DIRECTION (recorded as open, since
    shipped by later streams), and one is partly overtaken:
    • *Provider-side request validation* — the specific instance it names (Gemini
    grounding + client tools) now **fails fast**; `clientToolContinuationBuilder.ts:633-638`
    raises "Gemini cannot combine web_search grounding with client (function) tools in the
    same request", shipped by `ai-assist-antagonist` (PR #529). The generalized
    "incompatible request shapes registry" remains open; the entry should be narrowed.
    • *Generic-version-alias library surface* — substantially delivered by
    `ai-assist-model-aliases` (#505–#508) and `ai-assist-model-tiers` (#511–#515) as the
    `@<provider>:<role>` sigil scheme; the entry still reads as unqueued future scope and
    still cites `gpt-4o` as OpenAI's default, which the tier maps replaced.
    • *Library default `max_output_tokens` for reasoning models* — still open, but its
    stated workaround ("override via the existing `otherParams` mechanism") is superseded
    by the first-class `maxTokens` request param (#573).
    Still correctly open and correctly recorded: Gemini-side drift instrumentation;
    caller-visible thinking-content events (`ai-assist-thinking-events`, 🟡 in the ledger).
    Two items from the brief's out-of-scope list are also durably tracked as of 2026-08-14:
    MCP layer 2 shipped as `@fgv/ts-extras-mcp`, and `runToolUseConversation` was re-queued
    in `docs/FUTURE.md:125` by this sweep's predecessor after two streams had deferred it
