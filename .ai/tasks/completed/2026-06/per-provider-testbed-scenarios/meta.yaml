relatedStreams:
  - id: ai-assist-cross-provider-continuation
    relationship: >
      Sub-stream 1 of 3 (empirical-loop round 1, PR #454). Commissioned mid-cluster to
      unblock this stream's own paused PR #453: Copilot review found that
      `executeClientToolTurn` forwarded `continuationMessages` only to the Anthropic
      adapter, so the OpenAI/Gemini/xAI scenarios' continuation gate would have been a
      false positive. Shared this cluster's integration branch; reached `release` inside
      this cluster's promotion PR #459. This cluster's README is that stream's polished
      narrative — it has no README of its own.
  - id: ai-assist-cross-provider-fixes
    relationship: >
      Sub-stream 2 of 3 (rounds 2 and 3, PR #457). Closed the two disjoint bugs this
      cluster's FIRST live run surfaced: Gemini function-declaration schema sanitization
      (`additionalProperties` / `$schema` stripped for Gemini's OpenAPI-3.0 subset) and
      capture of `incomplete_details.reason` as the new `@public`
      `IAiStreamDone.incompleteReason`. The second shipped as a diagnostic instrument
      rather than a fix, and armed round 4.
  - id: ai-assist-responses-reasoning-events
    relationship: >
      Sub-stream 3 of 3 and cluster closeout (round 4, PR #458). Used #457's
      `incompleteReason` to falsify this cluster's own leading hypothesis (budget
      exhaustion) and found the real cause — an `item_id` ↔ `call_id` correlation bug in
      the OpenAI Responses streaming adapter — plus a second latent `call_id` bug in
      `buildOpenAiContinuation` that surfaced the moment the first fix let function calls
      flow. Also shipped the provider-drift instrumentation and the Gemini scenario fix,
      and drove the live re-run in which all four scenarios reached PASS.
  - id: ai-assist-client-tools
    relationship: >
      Predecessor cluster (closed 2026-06-04). Supplied `executeClientToolTurn`, the
      `IAiClientTool` typed-schema contract, the `anthropicClientTools` scenario this
      cluster's three scenarios are modelled on, and the pre-declared
      `IBuildMessagesOptions.rawTail` hook that round 1 consumed. Its Phase C is the L37
      reference observation this cluster re-instantiated four times.
  - id: ai-assist-thinking-events
    relationship: >
      Deferred-to, not implemented-by. The "thinking content present in stream" gate is
      verified only indirectly in all four scenarios because the adapters discard thinking
      content by design; surfacing it was ruled a separate scope decision. That stream is
      still 🟡 unshipped in `docs/WORKSTREAMS.md`.
summary:
  intended: >
    Stand up live-wire-verification testbed scenarios for OpenAI Responses, Gemini and
    xAI grok under `samples/testbed/src/scenarios/`, paralleling the existing
    `anthropicClientTools` scenario — each CLI-only, gated on its `<PROVIDER>_API_KEY`,
    pinned to a version-pinned (not dated, not `*-latest`) model alias, exercising
    thinking + a `recall_memory` client tool + a `web_search` server tool, and emitting a
    per-gate PASS/FAIL summary. The brief framed these as "the empirical safety net L37
    names": unit tests catch emitter-level correctness but cannot catch wire-shape
    mismatches with a provider's actual contract, and the `anthropicClientTools` scenario
    had already surfaced two such bugs on its first live run (PRs #448/#449). Explicitly
    out of scope: ANY change to `@fgv/ts-extras/ai-assist` — "if the stream surfaces a
    library bug, file as a follow-up finding in `findings/inbox/` and continue with the
    testbed; do not bundle library fixes into this stream" — plus the generic-version-alias
    library surface, MCP layer 2, `runToolUseConversation`, and any edit to the Anthropic
    template scenario.
  shipped: >
    The three scenarios exactly as briefed (PR #453) — `openaiClientTools` (`gpt-5.1`,
    `openAiEffort: 'low'`), `geminiClientTools` (`gemini-2.5-flash`,
    `geminiThinkingBudget: 1024`) and `xaiClientTools` (`grok-4.3`, `xaiEffort: 'low'`) —
    self-contained rather than sharing a runner, plus registration in the scenarios index,
    a corrected registry snapshot and a `coveragePathIgnorePatterns` entry for the
    live-API scenarios. AND the four library bugs the live runs surfaced, closed across
    three commissioned sub-streams (#454, #457, #458) on the same integration branch,
    promoted to `release` as one squash in #459. Final state: cross-provider continuation
    forwarding on all four providers, Gemini function-declaration schema sanitization, the
    `@public` `IAiStreamDone.incompleteReason` diagnostic, the OpenAI Responses
    `item_id` ↔ `call_id` correlation fix, `buildOpenAiContinuation` emitting the required
    `call_id`, and warn-on-unrecognized-SSE-event drift instrumentation on the Anthropic
    and OpenAI Responses adapters. All four provider scenarios PASS against the live APIs
    (2026-06-05).
  diverged: >
    **The cluster's mission inverted the brief's central prohibition, and that inversion
    is the whole story.** The brief forbade library changes and told the stream to file
    findings and continue. Three findings were filed — and every one was then commissioned
    as a library sub-stream on the same integration branch, because with the library
    unfixed the scenarios could not reach the PASS the stream existed to demonstrate. The
    testbed stayed the detector and never became the fix site (the brief's actual
    principle held), but "no `@fgv/ts-extras/ai-assist` changes in this cluster" did not:
    the cluster shipped a `@public` field, four runtime fixes and a new instrumentation
    surface. `result.md` still opens on the pre-live state ("No library changes... No
    `@fgv/ts-extras/ai-assist` modification was needed or made") because it was written
    2026-06-04, before any key was available; the README, written at close, tells the
    four-round story instead.

    **Every gate the stream itself could reach was GAPPED, and the gap was the deliverable.**
    `result.md`'s matrix reports GAPPED on every live gate for all three providers (no
    provider keys in the agent environment) with only the missing-key diagnostic path
    PASSing. The agent explicitly declined to mock a PASS. The empirical value arrived
    entirely from Erik's two subsequent live runs — which is precisely why the loop found
    four bugs that a 100%-coverage suite had not.

    **Round 4 falsified the cluster's own leading hypothesis.** Rounds 3 and 4 were framed
    around budget exhaustion on reasoning models; #457 shipped `incompleteReason`
    specifically to confirm it. The instrument reported `truncated: false`,
    `incompleteReason: undefined` — and the real cause was an adapter correlation bug. The
    diagnostic's clearest vindication is that it disproved the theory it was built to
    prove.

    **One brief-declared surface boundary was crossed and disclosed.**
    `samples/testbed/config/jest.config.json` was outside the declared package surface;
    the coverage exclusion for `[a-zA-Z]+ClientTools/` was added anyway (and retroactively
    covers the pre-existing `anthropicClientTools` scenario, previously collected at ~46%)
    as the honest way to satisfy "match testbed coverage convention / do not force 100%".
  sourceLine: '**Shipped:** 2026-06-05 via PR #458 (closeout) + the preceding three sub-stream PRs squash-merged into the integration branch. Cluster-close PR squash-merges `per-provider-testbed-scenarios` → `release`.'
