relatedStreams:
  - id: ai-assist-client-tools
    relationship: >
      layer 1 — shipped `IAiClientTool` / `executeClientToolTurn`; its design §3.3 is this
      stream's baseline design for the package
  - id: ai-assist-tool-annotations
    relationship: >
      downstream — later threaded MCP `Tool.annotations` through `adaptMcpTools` (PR #524),
      so the adapter as it stands today carries a field this stream did not ship
  - id: task-corpus-index
    relationship: >
      references this package to establish that the missing piece for a corpus MCP server is a
      *server*, not a capability — `ts-extras-mcp` is the client half and puts a server out of
      scope
