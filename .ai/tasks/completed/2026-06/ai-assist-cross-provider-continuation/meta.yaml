summary:
  intended: >
    Close the Anthropic-only gap in client-tool continuation wire-forwarding.
    The brief (`## Mission`) asked to extend `executeClientToolTurn`'s
    `continuationMessages` so it flows to **all four providers**' request
    builders as `rawTail`: widen `callOpenAiResponsesStream` and
    `callGeminiStream` with an optional
    `continuationMessages?: ReadonlyArray<JsonObject>`, have `buildMessages`
    (OpenAI/xAI Responses) and `buildGeminiContents` consume the pre-declared
    `IBuildMessagesOptions.rawTail`, forward it from the `openai` and `gemini`
    arms of `executeClientToolTurn`'s switch, and verify — "don't speculate;
    read `executeClientToolTurn`'s switch" — that xAI inherits via
    `apiFormat: 'openai'` routing. Explicitly out of scope: any Anthropic
    behavior change (read-only reference pattern), `samples/testbed` scenario
    edits (PR #453 was paused precisely to keep them in final form), MCP layer
    2, `runToolUseConversation`, and thinking-content surfacing. Minimum-additive
    discipline throughout; 100% coverage in `@fgv/ts-extras`; `code-reviewer`
    before coverage closure per L37.
  shipped: >
    Exactly that seam, on the four files the brief named. `callOpenAiResponsesStream`
    and `callGeminiStream` each gained a trailing optional `continuationMessages?`
    threaded to their builder as `rawTail`; `buildMessages` and
    `buildGeminiContents` now consume it; the `openai` and `gemini` switch arms
    forward it. Two `@internal` converters were added to `chatRequestBuilders.ts`:
    `openAiRawTailItemConverter` (an `isJsonObject` guard, item preserved whole)
    and `geminiRawTailMessageConverter` (projects to
    `{ role: 'user'|'model', parts: unknown[] }`). +7 tests, all asserting the
    captured **request body** rather than call success — OpenAI and Gemini tail
    shape, both providers' malformed-item skip, xAI inheritance driven end-to-end
    through `executeClientToolTurn`, and two no-options builder calls closing the
    `options === undefined` short-circuit with a functional test rather than a
    `c8 ignore`. xAI routing verified against `registry.ts`'s `xai-grok` descriptor,
    not assumed. No Anthropic behavior change; API Extractor produced no
    `etc/ts-extras.api.md` diff because every addition is `@internal`. All gates
    green; `code-reviewer` run before coverage closure (1 P1 + 3 P2 + 2 P3,
    all fixed or dispositioned with reasoning). Merged as PR #454 onto the
    cluster's integration branch, promoted to `release` in #459.
  diverged: >
    **The brief's sketched shape held; the shape of the *data* did not.** The
    brief asked `buildMessages` to "reconstruct the OpenAI Responses input
    shape: `function_call` items followed by `function_call_output` items",
    reading as a projection parallel to Anthropic's `{ role, content }` one.
    The stream instead appended OpenAI items **verbatim**, because Responses
    input items are a `type`-keyed discriminated union whose fields differ per
    item and any projection would drop the distinguishing fields — Gemini kept
    the projection (`{ role, parts }`) because its turns carry all payload in
    `parts`. That asymmetry is now a documented consumer-facing caveat in
    `LIBRARY_CAPABILITIES.md` ("the high-fidelity round-trip is on the
    OpenAI/xAI path; Anthropic and Gemini preserve only the projected fields")
    and is locked as a cluster architectural decision. It also cascaded two
    signature widenings the brief never mentions — `buildMessages` to
    `Array<Record<string, unknown>>` and `buildGeminiContents` `parts` to
    `unknown[]`, the latter forced by a `code-reviewer` P2 that caught
    `Array.isArray` being used to assert `Record<string, unknown>[]`, a type
    lie. `state.md`'s closing line — "the change matched the brief's sketched
    shape exactly; no ambiguity surfaced" — is the one artifact claim that
    reads as too clean.

    **The stream exited one acceptance criterion short, by harness rule.** The
    brief's last criterion was "PR opens against the `per-provider-testbed-scenarios`
    integration branch"; `result.md` records that the session's harness rule
    forbade opening a PR, so the agent pushed the branch and stopped, leaving
    that box and the Copilot-loop box unchecked in `state.md`. Erik opened #454
    the same day; Copilot's single review round generated **no comments**, so
    layer 2 was one round with zero findings — verified on the PR, recorded in
    no artifact.

    **"All four providers" was true of forwarding and not yet of the wire.**
    This stream could not live-verify (no keys in session; the brief made that
    explicitly not a blocker). The cluster's live runs the next day found the
    OpenAI/xAI continuation still rejected — `buildOpenAiContinuation` emitted
    the optional `id` where Responses requires `call_id` — so cross-provider
    continuation did not actually round-trip until PR #458. Nothing here is
    wrong; the ordering matters to anyone reading "shipped to all four
    providers" as "worked on all four providers".
  sourceLine: '**Completed:** 2026-06-04'
