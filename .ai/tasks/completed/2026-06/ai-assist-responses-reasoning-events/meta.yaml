closed: 2026-06
summary:
  intended: >
    Closeout sub-stream of the `per-provider-testbed-scenarios` cluster. Make the three
    streaming adapters self-diagnosing by warning on unrecognized SSE events (stable
    `ai-assist:unrecognized-event` tag), then use that instrumentation as a live debugging
    loop to add the missing OpenAI-Responses reasoning-mode event handlers so reasoning
    models (gpt-5.1 / grok-4.3) stop producing empty completions; drop `web_search` from
    the Gemini client-tools scenario (Gemini forbids grounding + function calling); and
    re-run all four live scenarios to PASS so the cluster-close PR can open.
  shipped: >
    PR #458. Drift instrumentation on the two SSE-event-named adapters (`RECOGNIZED_OPENAI_
    RESPONSES_EVENTS` / `RECOGNIZED_ANTHROPIC_EVENTS` allowlists, shared
    `UNRECOGNIZED_EVENT_WARN_TAG` + `formatUnrecognizedEventPayloadPreview()` in
    `common.ts`, one warn per stream per unknown event name). Two runtime fixes the live
    loop actually found: `item_id → call_id` correlation in `openaiResponses.ts`, and
    `buildOpenAiContinuation` emitting the required `call_id` (not the optional `id`) on
    function_call input items. Gemini scenario dropped `web_search` with two gates marked
    N/A. All four scenarios PASS live; 100% coverage; no public API surface diff.
    Note (verified 2026-08-14): the payload-preview shape `result.md` describes (200-char
    raw preview) was superseded before release by a PII fix on the cluster-promotion PR
    #459 (Copilot R2) — the default is now a structural-only preview (top-level JSON keys
    + byte length, never values), with the raw 200-char form opt-in via the
    `AI_ASSIST_UNRECOGNIZED_EVENT_FULL_PAYLOAD` env var. Everything else in `result.md`
    is present in current source verbatim.
  diverged: >
    Three real deltas. (1) The brief's diagnosis was wrong at the specific level and the
    stream said so: the missing arms were not new event names — `response.output_text.delta`
    and `response.function_call_arguments.{delta,done}` were already handled; the bug was
    within-event `item_id`/`call_id` correlation, which the drift instrument would NOT have
    surfaced (D1). No new `IAiStreamEvent` variants were needed. (2) A second, unbriefed P1
    surfaced live once fix #1 let function calls flow — the continuation builder's missing
    `call_id` HTTP-400'd OpenAI; filed as a finding and fixed inline in the same PR (D2).
    (3) The brief asked for symmetric warn-on-unknown across all three adapters; Gemini was
    dropped and deferred with a finding — its `generateContent` stream is JSON-chunk-shaped,
    so an event-name allowlist does not translate (D4). Recorded in `docs/FUTURE.md`.
  sourceLine: '**Status:** **cluster ready for close-out PR**'
