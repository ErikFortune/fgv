summary:
  intended: >
    Land two additive `@fgv/ts-extras/ai-assist` fixes for the two wire-shape /
    diagnostic bugs the `per-provider-testbed-scenarios` live runs surfaced beyond
    the continuation gap PR #454 had already closed: (1) sanitize the Gemini
    function-declaration parameters schema in `toGeminiTools` so `JsonSchema`-authored
    client tools stop 400ing with `INVALID_ARGUMENT` on `additionalProperties`, which
    Gemini's OpenAPI-3.0 subset rejects rather than ignores; (2) capture
    `incomplete_details.reason` in `responsesCompletedPayload` and surface it on the
    `done` event so the OpenAI/xAI "completed but empty" failure mode self-explains.
    Explicit scope cap: those two bugs only, no testbed edits, no default
    `max_output_tokens`, no deeper OpenAI/xAI root-cause work.
  shipped: >
    Exactly those two fixes, in one PR (#457) onto the cluster integration branch.
    Fix 1: new `@internal` `toGeminiParameterSchema(schema: JsonValue): JsonValue` in
    `toolFormats.ts`, applied at `toGeminiTools`'s `case 'client_tool':` arm — recursive,
    infallible, exported from the module but not the packlet barrel so it stays out of
    `.api.md`. Fix 2: `IResponsesCompletedPayload` + `responsesCompletedPayload` extended
    to optionally capture `incomplete_details.reason`; new `@public`
    `IAiStreamDone.incompleteReason?: string` (the entire public-surface diff, one field)
    threaded from `openaiResponses.ts`. All gates green at 100% coverage; `code-reviewer`
    run before coverage closure per L37 (no P1; one P2 and two P3 actioned); Copilot loop
    driven by the implementer and stopped at 3 rounds on diminishing returns.
  diverged: >
    The bug count matched exactly — 2 briefed, 2 shipped, nothing cut and nothing
    unbriefed — but three things moved. (1) THE BRIEF'S OWN IMPLEMENTATION SKETCH WAS
    WRONG and the stream corrected it: the sketched sanitizer stripped
    `additionalProperties`/`$schema` at every depth including inside a `properties` map,
    which would silently delete a real tool parameter literally so named. Copilot R1
    caught it; the shipped helper is keyword-aware (`properties` treated as a
    name→subschema bag, names preserved verbatim, subschemas still sanitized). A stream
    that had implemented its brief faithfully would have shipped that defect. (2) Fix 2
    shipped strictly more than briefed: the capture moves in lockstep with `truncated`
    (`truncated ? reason : undefined`) so a stray `incomplete_details` on a non-incomplete
    payload cannot leak and a duplicate `response.completed` cannot leave a stale reason —
    Copilot R2/R3, neither in the brief — and 5 done-event tests shipped against the 3 the
    brief listed (result.md's own Tests section still says 3; see the PR diff). (3) One
    acceptance criterion was NOT met and was deliberately declined: "both finding docs
    updated with the disposition" — the docs lived on the testbed agent's branch, outside
    the declared surface, so the disposition was recorded in result.md + the PR body and
    handed to cluster-close. That handoff only half-completed: the OpenAI/xAI finding was
    later folded in, but `2026-06-04-gemini-tool-schema-additionalproperties.md` still
    reads `Disposition: OPEN` today for a bug fixed by this PR. Finally, the hypothesis
    fix 2 was built to confirm was falsified by the diagnostic it added — the round-4
    stream read `truncated: false, incompleteReason: undefined` and found the real cause
    (item_id ↔ call_id correlation), which is the fix's clearest vindication rather than a
    failure.
  sourceLine: '**Status:** ready to merge — gates green, Copilot loop converged at 3 rounds, all threads resolved'
