id: crypto-batch-2-hpke
status: shipped
packages:
  - '@fgv/ts-extras'
  - '@fgv/ts-web-extras'
prs: [343, 346, 348]
closed: 2026-05
summary:
  intended: >
    Give a cross-repo consumer HPKE base mode (RFC 9180) for several Phase 2 flows —
    per-session material delivery, master-key wrap at unlock, recovery-proof envelopes,
    and later cross-instance delivery — each using the `info` parameter to bind a
    ciphertext to a specific context so a captured one cannot be replayed elsewhere. Two
    decisions were settled with the user before phase A: HPKE gets its own namespace
    rather than extending the existing `wrapBytes` / `unwrapBytes`, because ECIES-P256 and
    RFC 9180 HPKE X25519 are different protocols with different security properties and
    smearing them under one API would cost reason-ability (D1); and HKDF ships alongside
    HPKE in the same deliverable, with its exact placement left to the design (D2). Phase A
    was design only; phase B implemented against the resulting contract.
  shipped: >
    `HpkeProvider` for the DHKEM(X25519, HKDF-SHA256) + HKDF-SHA256 + AES-256-GCM suite,
    as a class with a private constructor and a `static create(subtle)` factory matching
    the shape of `NodeCryptoProvider` / `BrowserCryptoProvider` / `KeyStore` /
    `DirectEncryptionProvider`. Public surface is `sealBase`, `openBase`, `hkdf`,
    `encodeEnvelope` and `decodeEnvelope`, with Encap/Decap/KeySchedule kept private.
    D2 resolved to exporting HKDF from the HPKE class rather than adding a method to
    `ICryptoProvider`. 24 Node tests plus 18 browser tests, including anchors proving a
    Node-sealed ciphertext opens under jsdom Web Crypto. Coverage reached 100% in
    `ts-extras` but only 95%+ in `ts-web-extras` — short of this stream's own binding
    acceptance criterion, and disclosed as such in PR #348's description.
  diverged: >
    The load-bearing divergence is a correctness one, and it went the right way: phase B's
    step-zero RFC verification found that `design.md` §1 specified the label `"dh"` in
    ExtractAndExpand where RFC 9180 §4.1 requires `"eae_prk"`. The agent stopped, surfaced
    it, and corrected against OpenSSL's happykey and several independent implementations
    rather than implementing the signed-off design as written — a signed-off design being
    wrong on a cryptographic detail is exactly the case where following the contract would
    have shipped a silently non-interoperable HPKE. Note that `design.md` is archived with
    the error still in it, flagged by a pointer in the README rather than corrected in
    place. Second, the brief asked for "both Node and browser implementations" and what
    shipped is a single implementation in `ts-extras` with `SubtleCrypto` injected at
    construction, re-exported from `ts-web-extras` — the runtime difference collapsed into
    one argument. Third, the seal/open tests could not use published vectors: RFC 9180
    Appendix A carries no DHKEM(X25519) + AES-256-GCM vectors (A.1 is AES-128-GCM), so
    `SEAL_VECTORS` anchors on self-generated cross-runtime values, proving Node/browser
    agreement but not conformance to an external reference. This applies to the seal/open
    path only — the HKDF sub-primitive **is** externally anchored, by `HKDF_RFC5869_CASE1`
    from RFC 5869 Appendix A.1, exercised in both suites. Fourth, `_toBufferView` was
    copied into `hpkeProvider.ts` from `browserCryptoProvider.ts` (its own comment says
    so) to satisfy TypeScript 5.x's `Uint8Array<ArrayBuffer>` vs `ArrayBufferLike`
    strictness; the duplication is recorded in no debt ledger. Fifth, D2 offered three
    HKDF placements — an `ICryptoProvider.hkdf` method, an HPKE-namespace export, or
    **both** — and the design compares only the first two; "both" was dropped rather than
    considered and rejected, leaving the usual gap where a later reader re-litigates it.
    Finally, the re-export path was chosen as `CryptoUtils.HpkeProvider` rather than a
    `@fgv/ts-extras/crypto` subpath because the monorepo rig cannot resolve
    `exports`-field subpaths.
  sourceLine: '**Status:** Completed 2026-05'
notes:
  - >
    CORRECTIONS to an earlier draft of this file (2026-08-14):
    (a) It claimed "24 Node tests plus 18 browser tests at 100% coverage". The browser
    side did not reach 100%. PR #348's own description says "100% coverage in ts-extras;
    95%+ in ts-web-extras", and `brief-phase-b.md` made 100% in *both* a binding
    acceptance criterion — so this is an unmet criterion, disclosed at the time and then
    rounded up by me. The archived README is more careful than the draft was: it states
    100% only on the Node row and gives no figure for the browser row.
    (b) It claimed the `moduleResolution` constraint "has since been revisited... so
    `LIBRARY_CAPABILITIES.md` now documents the subpath as available". The causal story is
    backwards. The subpath line was added by the unrelated `private-key-storage` stream
    (#430), not by module-resolution work; and the module-resolution work reached the
    opposite conclusion — `esm-emit-design.md` Amendment 2 found `moduleResolution:
    bundler` illegal on a `module: commonjs` project and `node10` "the only legal value",
    which is what `libraries/ts-extras/tsconfig.json` still sets. The original constraint
    holds unchanged; the subpath resolves only under a *consumer's* own `bundler` setting.
    (c) It called the self-anchoring blanket; HKDF is RFC-5869-anchored (see `diverged`).
  - >
    #346 is NOT this stream's own PR. It is a single consolidated phase-B-brief PR
    ("docs(crypto-batch-2): consolidated phase B briefs for HPKE, Argon2id, WebAuthn")
    shared across three sibling streams, and all three ledger entries cite it correctly.
    Two independent antagonist passes flagged the duplicate citation as a suspected ledger
    error; both resolved it the same way. Read `prs` as "PRs this stream appears in".
  - >
    `sourceLine` is the README's opening status line and carries no claim about what
    shipped, because the README has no better-anchored opening claim to quote. Note it
    also drops a trailing double-space (a Markdown hard break) present in the source.
  - >
    Later evolution, recorded so a reader does not mistake current source for what this
    stream shipped: #536 added an optional sixth `recipientPublicKey?` parameter to
    `openBase` after this stream closed, so HEAD's signature differs from the #348
    snapshot.
