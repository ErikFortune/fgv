summary:
  intended: 'Phase A of a design-triage-implement-refine cluster: produce a binding design.md for
    @fgv/ts-prompt-assist v0.1 — a ts-res-driven prompt resolution library — validating the consumer-supplied
    conceptual model (non-negotiable) and its proposed data-structure shapes (adjustable) against
    fgv conventions, resolving three named open questions (scope encoding flexibility, resource-binding
    substitution merge semantics, watch() semantics), and locking the v0.1 API surface, package layout,
    dependency graph and acceptance criteria so Phase B could implement without further design adjudication.

    '
  shipped: "@fgv/ts-prompt-assist v0.1 as a whole cluster, not just a design: PromptLibrary.create
    / resolve (scope-chain walk, ts-res candidate selection, enforced-lock binding merge, recursive
    resource bindings with RFC 8785 cycle detection + depth cap, verbatim Mustache render) / resolveJsonOutput<K>
    / resolveFreeTextOutput / describe; IPromptStore (read-only at v0.1) with FileTreePromptStore
    and PromptStoreFixture.build; PromptRegistry<TResponse> with three typed sub-registries; IPromptSafetyPolicy;
    buildSimpleDescriptor. Plus two upstream extensions it needed to be coherent — MustacheTemplate.create(t,
    { escape: 'none' }) on @fgv/ts-extras, and the ts-res-typed-conditions sub-stream that taught
    @fgv/ts-res to honour qualifier-name semantics at both type and runtime levels — plus an end-to-end
    demonstration in samples/ai-image-gen-sample. Promoted to release via #397.

    "
  diverged: 'Four divergences, one of them a process reversal that outlived the code. (1) PROCESS
    — the single-agent Phase B was abandoned. #359 was retired without merge after mid-run context
    drift produced ~35 reviewer-flagged issues, forcing a rescope into eight sub-phase commissions
    (B-0a … B-5) with ten explicit guardrails added in brief-phase-b.md. Every sub-phase then landed
    clean. The cluster''s durable output is arguably this operating model, not the library. (2) PUBLIC
    SURFACE — the surface-tidy round (#372) replaced resolveAndValidateOutput<T> with resolveJsonOutput<K>
    + resolveFreeTextOutput, deleting the last caller-asserted-T boundary in favour of a runtime-evidenced
    kind check against the descriptor''s output.kind, and retiring both surviving P2 TECH_DEBT entries.
    (3) SCOPE GROWTH — the two consumer-port pressure tests (round 1 = 14 findings, 0 P1 / 5 P2 /
    9 P3; round 2 a deliberate cold-start integration reporting "materially smoother than round-1")
    pushed ergonomics work into three packages the Phase A brief never named: ts-utils (#375 Failure.withType),
    ts-res (#376), ts-extras (#377 Yaml browser export bug). Round-1 triage also reversed several
    of its own findings — F5/F10/F11 retracted by the agent on review, F6 dropped as breaking fixture→FileTree
    migration symmetry, F7/F8 deferred to v0.2 pending real consumer evidence. (4) ARCHITECTURAL
    LAYER MOVED — round-2 finding F1 was first attempted as local sibling types inside ts-prompt-assist
    (#385), then as leaf-only Decl parameterization in ts-res (#386). A senior-developer stress-test
    addendum (#389) showed #386 had no plumbing through the container types, so the narrow could
    not reach the leaf from any realistic authoring chain. The fix moved down a library to a full
    Decl-tree cascade plus sibling typed* Converter exports, spawning the ts-res-typed-conditions
    sub-stream — an instance of the repo''s "extend the core library rather than work around it"
    rule being applied mid-stream at real cost.

    '
  sourceLine: This cluster delivered `@fgv/ts-prompt-assist` v0.1 — a ts-res-driven prompt resolution
    library with Mustache substitution, scope-chain walking, resource bindings, output validation,
    and LLM-prompt safeguards — plus the upstream `@fgv/ts-res` capability changes that the v0.1
    needs to be coherent
