id: ai-assist-model-catalog-2026-09
status: shipped
packages: ['@fgv/ts-extras']
prs: [692]
openPrs: []
opened: 2026-09-24
closed: 2026-09-24
summary:
  intended: >
    Rotate the ai-assist model catalog for OpenAI, Anthropic, Gemini and xAI. Every identifier had
    to come from a fetched documentation page, cited by URL and date. The brief named three manual
    axes (aliases/defaultModel, the listModels idPattern rules, the *ModelNames unions) plus the
    per-model capability tables. Each capability edit needed a cited release note, and the check had
    to record which tables were left unchanged. Output was offline-green plus a cited id list for the
    user's testbed run; no live verification.
  shipped: >
    OpenAI tiers moved to gpt-6-luna / gpt-6-sol / gpt-6-astra and the image alias to
    gpt-image-2.5-sunburst. Gemini flash moved to gemini-3.8-flash and flash-lite to
    gemini-3.5-flash-lite. xAI flagship moved to grok-4.7 and imagine to grok-imagine-image-2.0.
    New idPatterns: /^gpt-6/, /^grok-4\.7/, /^grok-4\.6/. The unions gained the new ids and dropped
    two OpenAI deep-research ids that were already shut down. A new quality-capable xAI image entry
    shipped, plus the builder wiring that makes the capability true. Every capability table was
    checked and its disposition recorded. The cited id table is in result.md. After the first live
    run, a thinking fix shipped: thinkingRequiredModelPrefixes plus IThinkingConfig.onUnsupported,
    where 'none' is sent as 'low' by default and 'fail' refuses the call. The testbed canaries also
    gained thinking, strict-none, model-override and live-image probes. Live-verified by the user's
    testbed run on 2026-09-25 (OpenAI, Gemini, xAI).
  diverged: >
    Anthropic was not rotated, although the brief scoped four providers. claude-opus-5-5 and
    claude-fable-5-1 reject forced tool_choice, which is the only Anthropic structured-output
    mechanism, so the aliases were held and a P2 was filed. Step zero said to stop if any
    documentation host was blocked. docs.anthropic.com still was, but the sweep proceeded because
    docs.claude.com now redirects to platform.claude.com, which was reachable. Two things shipped
    that the brief did not name. First, code wiring: the xAI image builders never sent the resolved
    quality option, so the capability flag alone would have been a false claim. Second, test-pin
    updates in samples/testbed, outside the declared package surface, caught by the repo-wide test.
    The TECH_DEBT manual-axes entry, which counted two axes, now names the per-model capability
    declarations as a third. The brief already listed those tables. code-reviewer ran after
    coverage was already at 100% (no coverage-closure phase occurred), not before it. The user's
    live run found three models that reject thinking 'none'. That turned a pure rotation into one
    new capability (the thinking-required declaration and onUnsupported), added at the user's
    direction to roll forward rather than hold the frontier and advanced tiers back.
  sourceLine: "**Shipped:** ai-assist's tier and image aliases now resolve to the current OpenAI, Gemini and xAI lines, each id taken from a fetched provider page — while Anthropic's are held, because its successors reject the forced tool call its structured output depends on."
  headline: >
    ai-assist's tier and image aliases now point at GPT-6, Gemini 3.8 Flash and Grok 4.7, each id
    cited from a fetched provider page; Anthropic's are held until structured output stops forcing
    a tool call.
