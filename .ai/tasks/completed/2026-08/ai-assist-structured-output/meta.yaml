id: ai-assist-structured-output
status: shipped
packages:
  - '@fgv/ts-extras'
  - '@fgv/ts-json-base'
  - '@fgv/ts-app-shell'
  # Not published, but it carries a real surface from this stream (four scenarios,
  # a probe module, 28 tests) and its own coverage gate — and the ledger's
  # "Package surface" line already names it.
  - 'samples/testbed'
prs: [652]
# #652 is OPEN at the time of writing, so it is deliberately NOT in `prs` — that
# list asserts a merge. Move it across when it lands.
openPrs: []
opened: 2026-08-21
closed: 2026-08-22
summary:
  intended: >
    Let a caller that has already declared the shape it wants tell the PROVIDER,
    rather than only asking the model in the prompt, and let it learn which
    enforcement was actually applied so it can decide whether its defensive path
    is still needed per response. Filed from a PersonAIlity ask whose every
    load-bearing claim was verified against release before filing, with one
    correction in their favour: a FOURTH completion path (callGeminiCompletion)
    also carried no response schema, and Gemini's native structured output lives
    inside the generationConfig it already builds, so it was the cheapest of the
    four rather than an extra cost.
  shipped: >
    All of it, on four providers plus the proxy path. Request side: an optional
    structuredOutput on IProviderCompletionParams, a discriminated union of
    { mode: 'schema', schema } and { mode: 'json-object' }, with an
    onUnsupported: 'degrade' | 'fail' defaulting to degrade. Report side: a
    REQUIRED structuredOutput: StructuredOutputEnforcement on
    IAiCompletionResponse ('none' | 'json-mode' | 'schema' | 'tool-forced').
    Capability declared per model family on IAiProviderDescriptor.structuredOutput
    across four wire formats, longest-prefix matched AFTER alias resolution
    through the same generic helper the image and embedding capabilities use.
    generateJsonCompletion adopts it with no new parameter, via a new
    JsonSchema.isSchemaValidator guard added to ts-json-base rather than
    hand-rolled in ts-extras.
  diverged: >
    Nothing diverged from the settled surface. Three things are worth recording.
    (1) The consumer's two open questions -- where the report lives, and what the
    degradation posture is -- turned out to be ONE question: lenient-by-default
    is safe only because the report is required, so the interlock went in the
    docstring rather than only in the ledger. (2) Their third question (whether
    generateJsonCompletion should adopt) dissolved rather than being decided:
    ISchemaValidator<T> extends Validator<T>, so a caller could already pass a
    JsonSchema as converter and the library simply did not look. Adopting is
    therefore "look", not "add a parameter" -- and a parameter would have
    reintroduced exactly the converter/schema drift JsonSchema exists to remove.
    (3) The max-lines prerequisite fired TWICE. Splitting the three ai-assist
    test files first (#650) was correct and removed that wall; model.ts then blew
    the cap anyway, at 2132 lines, which the sweep had not predicted because it
    listed the file as having 43 lines of headroom. The remedy was a clean cut
    (the structured-output types depend on nothing in model.ts) rather than one
    chosen under pressure, but the lesson is that the sweep belongs at the START
    of every stream, not once.

    (4) The live run added a fifth defect and one correction. The four testbed
    scenarios this stream wrote surfaced a PRE-EXISTING library defect unrelated
    to structured output: callGeminiCompletion read candidate.content.parts[0].text
    and silently discarded every other part, while the streaming adapter has
    always concatenated -- so the same Gemini response yielded different text
    depending on the path. Bundled and fixed here because this stream's own
    testbed found it and it sits in a function this stream already touches;
    disclosed as a bundled latent-bug fix per CODE_REVIEW_CHECKLIST.
    The correction: this stream PREDICTED that fix would not change the Gemini
    json-object outcome (a stray EXTRA brace is more content, which dropping
    parts cannot produce). The re-run passed. The prediction was wrong and the
    mechanism is NOT established -- one passing re-run cannot distinguish "the
    fix cured it" from "Gemini's schema-less JSON mode is nondeterministic and
    this draw was clean". Recorded as an open question rather than a cure.
    (5) The probe was wrong before the library was: the first live OpenAI run
    failed json-object because the probe demanded schema conformance in a mode
    that promises arbitrary shape. Fixed by making the assertion follow the mode.
    The same run hung, so probes now carry an AbortSignal.timeout.
  sourceLine: >
    A caller that has already declared the shape it wants can now **tell the
    provider**, and learn **which enforcement was actually applied** — on all four
    providers plus the proxy.
keywords:
  - structured output
  - the caller supplies intent the response reports outcome
  - required field removes a three-ways-ambiguous absence
  - lenient default is safe only because the report is required
  - conflict is not degradation
  - anthropic forced tool use is not a spelling of schema
  - re-serialize tool input so content stays a string
  - no new parameter means no drift
  - extend the primitive isSchemaValidator
  - alias-first capability resolution
  - max-lines fired twice
