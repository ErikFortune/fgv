id: fragment-query-scoping
status: shipped
# Published packages only. `samples/testbed` was also edited (the fragment
# persistence demo's `query` call site, caught by the repo-wide rebuild) but
# `shouldPublish: false`, so it carries no change file and does not belong in a
# package list an index reads.
packages:
  - '@fgv/ts-agent-memory'
  - '@fgv/ts-agent-memory-sqlite-vec'
# Two branches into integration/fragment-query-scoping (#638 docs, #639 impl),
# then one squash promotion to release.
prs: [638, 639]
openPrs: []
opened: 2026-08-18
summary:
  intended: >
    Make a fragment search expressible as "the best topK passages OF THIS
    RECORD", with the narrowing applied during selection rather than as a
    post-filter. Filed from a PersonAIlity ask whose diagnosis was verified
    against source before filing: a document-scoped passage search had to
    over-fetch globally and discard, so the requested topK was not the topK that
    reached the index, and no amount of consumer-side work could fix it because
    the truncation happened before they saw anything. Breaking, on a pre-1.0
    surface, across one contract with two implementations.
  shipped: >
    All of it. IFragmentQuery gains entityId + kind (required together);
    IFragmentVectorIndex.query takes an IFragmentQueryOptions bag
    ({ maxPerRecord?, scope?, id? }) replacing the positional maxPerRecord;
    a new IIdentityResolver seam (implemented by IMemoryStore) turns
    (kind, entityId) into a storage address without reading the record; and
    FragmentSemanticRetriever.create takes an optional identityResolver.
    Both index implementations, plus the testbed call site, landed in the same
    PR per the shared-contract rule. SqliteVecFragmentIndex pushes a scope+id
    narrowing into the vec0 PARTITION KEY, which is where the predicted win
    lands; scope-only cannot express a prefix in SQL and applies a JS prefix
    filter over the full ranked set, still ahead of the topK cut.
  diverged: >
    One divergence, and it corrects the brief rather than the code. The brief
    and BOTH handoff notes said the per-entity subtree layout meant "no asOf
    axis needed" — as though versioning fell out of the layout completely. It
    does not: TemporalVersionedPolicy._invalidateCurrents stamps invalid_at and
    NEVER calls fragmentIndex.remove, so a versioned narrowing returns every
    version's fragments, current and superseded alike, and nothing on an
    IVectorQueryHit distinguishes them. What the layout removed is the
    AMBIGUITY, not the filtering. Verified against source rather than assumed
    and corrected in five places including the note already sent. Also: the
    fourth consecutive max-lines extraction on fileTreeMemoryStore.ts
    (1999 -> storeIdentity.ts -> 1989), which fired that TECH_DEBT entry's own
    promotion condition, so it is now P1.
    The brief's "watch it fail against a post-filter first" gate was executed
    literally: the in-memory index was rewritten to post-filter, the
    before-the-topK-cut test went red (expected 2, received 0), and the OTHER
    TWO narrowing tests stayed green at topK: 10 — the brief's warning that a
    post-filter passes every naive version of the test, made concrete.
  sourceLine: >
    **Shipped:** a fragment-semantic search can now be **narrowed to one
    record**, with the narrowing applied **during selection, before the `topK`
    cut** — `IFragmentQuery` gains `entityId` + `kind` (which travel together
    because `kind` selects the identity codec, making a colliding `entityId`
    across kinds structurally unambiguous rather than merely unlikely), and
    `IFragmentVectorIndex.query` takes an `IFragmentQueryOptions` bag.
keywords:
  - fragment retrieval
  - record narrowing
  - applied before topK
  - identity codec as a function
  - colliding entityId across kinds
  - IIdentityResolver
  - vec0 partition push-down
  - breaking pre-1.0
  - max-lines extraction
  - superseded fragments are not pruned
  - watched-it-fail gate
