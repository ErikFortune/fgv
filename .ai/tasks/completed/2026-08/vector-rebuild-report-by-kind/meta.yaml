notes: >
  On its own branch stacked on `integration/sweep-followups`. `status` stays `in-flight` and the
  ledger marker stays blue until the PR merges to `release` — the ledger's own legend defines
  green-tick as "merged to `release`", and marking it earlier asserts a merge that has not
  happened. `prs` is filled in when the PR opens; an empty list is the honest state rather than
  naming the integration branch's own PR, which this stream does not belong to.
  Open and not yet discharged: the coordination flag has been WRITTEN but not acknowledged. The
  brief called coordination "required and not optional" because a silent arrival is the failure
  mode, and writing the note is only half of that. Confirm PersonAIlity has read
  `.ai/notes/cross-repo-handoffs/personaility-reply-2026-08-15-rebuild-report-shipped.md` before
  the alpha carrying this publishes.
