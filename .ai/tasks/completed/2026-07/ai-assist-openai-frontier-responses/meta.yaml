id: ai-assist-openai-frontier-responses
status: shipped
packages: ['@fgv/ts-extras']
prs: [522]
closed: 2026-07
summary:
  intended: >
    Make OpenAI Responses-API-only models invokable on the completion and
    streaming-completion paths via a declarative `responsesOnlyModelPrefixes` marker on the
    provider descriptor plus an `isResponsesOnlyModel` predicate reused at both dispatch
    sites, make the Responses callee's `tools` optional (omitting the body field when
    empty), then restore `frontier: '@openai:pro'` to the OpenAI `defaultModel` map. Ends
    at a STOP-FLAG: build the live `gpt-5.5-pro` canary, do not run it.
  shipped: >
  diverged: >
  # summary.shipped / diverged intentionally BLANK: only brief.md exists — no result.md,
  # no README.md, no state.md. In particular the brief's STOP-FLAG means the stream was
  # required to hand back a live-canary note; whether it did, and what the principal's
  # live gpt-5.5-pro run returned, is recorded nowhere in this directory. Inventing either
  # would be a false claim. See notes.
  sourceLine: '# Brief — ai-assist: route OpenAI Responses-API-only models through the completion path (restore invokable frontier)'
  # sourceLine is the opening line of brief.md (the commission), NOT a result/README opener.
keywords:
  - openai
