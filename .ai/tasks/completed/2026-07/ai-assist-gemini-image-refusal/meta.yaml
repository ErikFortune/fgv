summary:
  intended: >
    Stop reporting a well-behaved Gemini image-generation refusal as a wire-shape parse
    failure. Model `finishMessage`, make the candidate's `content` optional, drop the
    non-empty `parts` constraint, and fail with a legible, substring-matchable
    `Gemini image generation declined: <finishReason>[ — <finishMessage>]` instead of
    `candidates[0].content: Field not found`.
  shipped: >
  diverged: >
