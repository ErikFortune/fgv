  # stream did, and synthesizing one from the brief plus the current source would present
  # this sweep's inference as the stream's own record. See notes for the sweep's finding.
  sourceLine: '# Brief — ai-assist: surface Gemini image-generation refusals cleanly'
  # sourceLine is the opening line of brief.md (the commission), NOT a result/README
  # opener — this stream has neither.
