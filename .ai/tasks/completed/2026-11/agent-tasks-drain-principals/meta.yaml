id: agent-tasks-drain-principals
status: shipped
packages: ['@fgv/ts-agent-tasks', '@fgv/testbed']
prs: [] # PR #TBD — not yet opened; the orchestrator fills it in when it does
openPrs: []
opened: 2026-11-12
closed: 2026-11-12
summary:
  intended: >
    Close the P2 that bindDelivery checks only consumerId, so any host code naming a consumer can
    bind and drain it: record drain principals at subscribe (optional, default the registering
    principal, converter-validated, persisted, visible on ITaskSubscription); refuse any other
    principal at bindDelivery with not-found-or-denied; treat persisted subscriptions without the
    field as registrant-only and give the host a trusted way to change the list; close the #762
    disposeWithheld policy-identity residual if it fits cleanly, otherwise write the design down;
    update the testbed's host-subscribes / agent-drains sites; merge origin/release in first and
    gate the merged tree.
  shipped: >
    ISubscribeRequest.drainPrincipals (bounded by maxDrainPrincipals, de-duplicated, stored
    ascending, default the registrant alone) on the subscription specification and descriptor;
    bindDelivery and TaskDeliveryPump.create refuse an unnamed principal with the answer a missing
    subscription gets, and every bound-delivery operation re-applies the rule; drainPrincipalsOf for
    legacy records; TaskBroker.setSubscriptionDrain plus ITaskRepositoryWriter.setSubscriptionDrain;
    ITaskAuthorization.policyIdentity and ISubscribeRequest.policyIdentity, which disposeWithheld now
    requires to agree; trustedKindAuthority takes an identity; testbed journey names every drainer and
    checks an unnamed one is refused; a 21-row revert matrix and a check-then-act table. Step 0 merged
    release cleanly against #758 as the effective base and trimmed the capability router under its cap.
  diverged: >
    Decision 4 was built rather than deferred. Beyond the brief, every bound-delivery operation
    re-checks the drain rule against the subscription as it stands, so a binding made before a
    principal was removed cannot keep draining; and disposeWithheld's principal rule moved from the
    registering principal to any drain principal. When a list is given the registrant is not added.
    Re-subscribe was not an update path, so setSubscriptionDrain was added, and a retry of the
    original subscribe after a change is conflict. The #780 TECH_DEBT entry was not on the branch
    after Step 0, so its closure is recorded in result.md for the orchestrator to reconcile.
  sourceLine: "**Shipped:** a subscription now records the principals that may bind and drain its delivery — `bindDelivery` refuses anyone else exactly as it refuses a missing subscription, every bound-delivery operation re-applies the rule, the host can change the list through `TaskBroker.setSubscriptionDrain`, and `disposeWithheld` ends withheld obligations only through a binding whose policy carries the identity the subscription recorded as the consumer's own."
  headline: >
    Only the principals an agent-task subscription names may bind and drain its delivery, and
    disposeWithheld ends withheld obligations only through the consumer's own policy, by identity.
