summary:
  intended: >
    A user request: refresh the monorepo's dependencies, security first. Audit the lockfile and
    record a baseline; reach zero critical, high and moderate wherever a fix needs no major bump of
    a direct dependency, by direct bumps first and narrowly scoped globalOverrides second; take
    every minor and patch within the current major; take a major only if it is the only fix for a
    high or critical; report the other majors with impact and effort; treat the toolchain as
    majors-only-with-a-reason; never pick a version younger than the release-age policy, and prove
    a clean rush install accepts the lockfile.
  shipped: >
    Audit 173 advisories (4 critical, 73 high, 84 moderate, 12 low) to 4 (2 moderate, 2 low): Rush
    5.177.2 to 5.182.1, pnpm 11.12.0 to 11.28.9, one rush update --full, six direct security bumps
    (hono, js-yaml, @huggingface/transformers, and raised floors for @modelcontextprotocol/sdk,
    axios, react-router-dom), two overrides (css-minimizer-webpack-plugin>serialize-javascript,
    sockjs>uuid), and 58 more direct ranges to the latest release in their major. No major taken.
    22 patch and 13 none change files. 22 majors reported with effort.
  diverged: >
    The Rush bump became a precondition: on 5.177.2, globalOverrides was silently ignored, because
    Rush wrote it where pnpm 11 does not read it. The Heft toolchain family was taken, failed
    rush rebuild and was put back to its base pins. heft-lint-plugin 1.3 lints non-TS files, and
    @rushstack/eslint-config 4.9 warns on every private member. Both are reported as an effective
    major. re2js and @typesafe-ai/sdk were held by their packages' own bump policies. The one
    forced source change was not anticipated: MCP SDK 1.32 defaults to same-origin redirects. That
    broke a ts-extras-mcp test control, which only the repo-wide rush test caught, and made that
    package's TSDoc and README inaccurate. All three were updated. The open glob and minimatch
    moderates need a transitive major that their parents do not range.
  sourceLine: "**Shipped:** the monorepo's dependency audit went from 173 advisories (4 critical, 73 high, 84 moderate, 12 low) to 4 (2 moderate, 2 low, none with a fix that a direct bump or a same-major override can deliver), with Rush 5.182.1 / pnpm 11.28.9, a full lockfile refresh, six direct bumps, two scoped overrides, and a minor/patch refresh of 58 more direct dependencies within their current major."
  headline: '' # opted out: a dependency refresh adds no capability a consumer would look up
