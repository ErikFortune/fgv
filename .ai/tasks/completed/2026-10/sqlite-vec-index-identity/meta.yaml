summary:
  intended: >
    personaility#699: the two sqlite-vec index classes recover only the dimension on reopen, so two
    same-width embedding models are indistinguishable and a model swap silently serves vectors from
    another embedding space; rebuild is not atomic and a crash leaves an undetectable partial table.
    Store an opaque identity in the index file (one fgv_sqlite_vec_meta row per table), report it
    via identity() read every call, fence add/addFragments/query on mismatch or incomplete, commit
    the identity with the first write and at the end of rebuild, allow adoptIdentity() only on
    absent, and leave the interfaces and in-memory indexes untouched.
  shipped: >
    Exactly that surface on SqliteVecVectorIndex and SqliteVecFragmentIndex: identity?: string on
    all four param interfaces, identity() and adoptIdentity() returning IIndexIdentityReport, a
    lazily created meta table read through a strict converter (bigint-tolerant, meta_version 1
    only), first-write table creation and identity row in one transaction, rebuild clear plus
    'rebuilding' marker in one transaction with a conditional final commit, and every fence check in
    the same transaction as the read or write it guards. README, CAPABILITIES and api.md updated;
    change file minor.
  diverged: >
    The meta statements could not live in _stmts (undefined until a dimension exists) and went into
    a retained, release()-dropped cache on a shared internal IndexIdentity helper instead. The
    existing "a rebuild prepares nothing" tests had to warm up with one rebuild, because the first
    rebuild now prepares and keeps the meta statements. Choices the brief left open: incomplete
    outranks unchecked, an identity-less first write deletes an orphan row rather than creating the
    meta table, an identity-less rebuild still writes the marker, and the final commit fails if the
    marker changed underneath it. Two close-out questions were answered yes and landed on the same
    branch: identity() takes its reads in one read transaction, and adoptIdentity() is an idempotent
    no-op on match (the brief said absent-only). An adversarial review round then found that a
    rebuilding row on a still-fresh index read as fresh, letting another handle certify its identity
    over the rebuild (P1); a rebuilding row now reads incomplete regardless, every write transaction
    is IMMEDIATE, the rebuild clears from the file's state, a width change fails in every mode, and
    a release mid-rebuild leaves incomplete. Left open and documented: concurrent rebuilds on two
    connections, and an identity-less handle neither gets nor gives protection.
  sourceLine: '**Shipped:** `SqliteVecVectorIndex` and `SqliteVecFragmentIndex` store an opaque embedding identity in the index file itself, report it with `identity()` on every call, fence writes and queries while it disagrees or a rebuild never finished, and make a partial rebuild detectable instead of silent.'
  headline: >
    The sqlite-vec indexes now store which embedding model wrote their vectors in the same file, and
    refuse to mix models or serve a half-finished rebuild until you rebuild.
