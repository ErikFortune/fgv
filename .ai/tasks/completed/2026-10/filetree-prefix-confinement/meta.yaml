opened: 2026-10-27
closed: 2026-10-27
summary:
  intended: >
    Close the TECH_DEBT P2 "FsFileTreeAccessors' prefix does not confine". User-decided design: one
    absolutePathPolicy ('unconfined' default, 'confined' prepends the prefix to a resolved path
    outside it, 'verified' fails) applied to every read and write, judged on the resolved path; a
    separate realPath option reusing _confineToRoot's rule, on by default under 'verified'; creation
    with either and no prefix fails; options on an fs-specific params type; atomic behaviour
    unchanged; prefix TSDoc, fileTreeHelpers wording, CAPABILITIES.md, README and TECH_DEBT updated;
    a minor change file; an escape matrix and a revert matrix as evidence.
  shipped: >
    All of it. IFsFileTreeInitParams extends IFileTreeInitParams with absolutePathPolicy and
    realPath; FsFileTreeAccessors.create returns the Result, forFilesystem uses it, and the
    constructor throws for an invalid combination. Every filesystem-touching operation goes through
    one _resolveConfined step. Also exported: FsAbsolutePathPolicy, allFsAbsolutePathPolicies, and
    the effective absolutePathPolicy / realPath on the accessors. Escape matrix 5 configurations x 10
    path classes x 15 operations, observed and asserted; revert matrix 19 rows, all red.
  diverged: >
    A relative '..' escape under 'confined' resolves against the prefix as though it were the root,
    rather than being refused (the brief left the choice open), because resolveAbsolutePath is total
    and items store its output, so a refusal would be bypassed through any item. The real-path check
    inspects the target itself and refuses dangling links, rather than reusing _confineToRoot's
    containing-directory check, because plain reads and writes follow a final link. realPath under
    'unconfined' is refused at creation, a case the brief did not name. Keeping the atomic methods
    unchanged needed _confineToRoot and _qualifyDirectory to stop calling the newly policy-checked
    resolveRealPath.
  sourceLine: "**Shipped:** `FsFileTreeAccessors` and `FileTree.forFilesystem` take an `absolutePathPolicy` — `'unconfined'` (the default, unchanged), `'confined'` or `'verified'` — and a `realPath` option, applied to every read, listing, stat and write, so a prefixed filesystem tree can finally be a sandbox; asking for either without a prefix fails creation."
  headline: >
    A filesystem FileTree can now be a sandbox: absolutePathPolicy 'confined' maps every path
    beneath the prefix, 'verified' refuses one outside it, and realPath refuses symbolic links that
    lead out. The default is unchanged.
