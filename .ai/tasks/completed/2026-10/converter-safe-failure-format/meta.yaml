id: converter-safe-failure-format
status: shipped
packages: ['@fgv/ts-utils', '@fgv/ts-json-base', '@fgv/ts-extras', '@fgv/ts-bcp47']
prs: [] # #TBD — the PR is opened by the orchestrator; fill on open
openPrs: []
opened: 2026-10-30
closed: 2026-10-30
summary:
  intended: >
    personaility#714 / #713: converters and validators formatted failures with JSON.stringify(from),
    which threw on a cyclic input and escaped the Result boundary. Add one public, pure, never-throwing
    formatter in ts-utils (cycles, BigInt, symbols, functions, class names, contained getters / Proxy
    traps, bounded length and depth, no toJSON) that is byte-identical to JSON.stringify for JSON-safe
    values under the bound; route every failure-message site in ts-utils conversion / validation /
    collections and the ts-json-base equivalents through it, leaving content uses alone; decide on a
    captureResult guard at the converter / validator boundary; classify every site; show regression
    tests red first; repo-wide rush test.
  shipped: >
    formatValueForMessage(value, options?) in ts-utils base: JSON.stringify with a replacer that only
    turns an active-path cycle into "[Circular]" and a BigInt into "123n" (byte-identical for every
    value JSON.stringify rendered, up to 200 characters), with a never-throwing fallback renderer for
    what still throws; IFormatValueForMessageOptions and three default constants. Every
    failure-message JSON.stringify in both packages routed through it, plus the normalizers'
    messages. BaseConverter and GenericValidator turn a throw into a "converter threw:" /
    "validator threw:" Failure and re-throw stack exhaustion to the outermost boundary. The recursive
    ts-json-base JSON converters and validators fail at once on a cycle. classifyJsonValue no longer
    throws. Same pattern fixed in ts-extras conversion and ts-bcp47 validationHelpers;
    stringifyLogValue made total. 240 of 333 hostile-input cases red before the fix; repo-wide rush
    test green with no downstream test text changed.
  diverged: >
    The sweep found the same throw in template-literal and String() failure sites that the brief's
    JSON.stringify count did not cover; they were fixed with an added style: 'string' option that
    keeps their text. The boundary guard was added (the brief left it open). Review round 1 reversed
    two round-0 calls: the guard as first written turned stack overflow into an exponential hang and
    now re-throws exhaustion to the outermost boundary; and the formatter, first a hand-written walker
    that skipped toJSON per the brief, now calls JSON.stringify itself so every previously-rendered
    value is byte-identical, with the walker as fallback. The recursive JSON converters gained a cycle
    check (first recorded as TECH_DEBT, then fixed in the same stream). Review round 2 made the
    fallback a reimplementation of JSON.stringify so parity holds above the length bound, removed
    maxDepth, narrowed stack-exhaustion detection to name plus message substring (a RegExp aborts V8
    near the stack limit), and inlined the boundary back to baseline speed. Two c8 ignore directives
    on reachable failure lines were removed; one was added for engines without JSON.isRawJSON,
    pending approval.
  sourceLine: '**Shipped:** converter and validator failure messages can no longer throw. A new `formatValueForMessage` in `@fgv/ts-utils` renders any value — cyclic, `BigInt`, symbol, Proxy, throwing getter, huge or deep — as bounded text, and is byte-identical to `JSON.stringify` for JSON-safe values within its bounds. `BaseConverter` and `GenericValidator` additionally turn any throw from the function they wrap into a `Failure`, so `convert`, `validate` and `guard` never throw.'
  headline: >
    A converter or validator handed a cyclic, BigInt or Proxy value now fails instead of throwing,
    via a new formatValueForMessage that matches JSON.stringify for ordinary values.
keywords:
  - circular structure
  - cyclic input
  - JSON.stringify throws
