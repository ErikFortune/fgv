id: converter-safe-failure-format
status: shipped
packages: ['@fgv/ts-utils', '@fgv/ts-json-base', '@fgv/ts-extras', '@fgv/ts-bcp47']
prs: [] # #TBD — the PR is opened by the orchestrator; fill on open
openPrs: []
opened: 2026-10-30
closed: 2026-10-30
summary:
  intended: >
    personaility#714 / #713: converters and validators formatted failures with JSON.stringify(from),
    which threw on a cyclic input and escaped the Result boundary. Add one public, pure, never-throwing
    formatter in ts-utils (cycles, BigInt, symbols, functions, class names, contained getters / Proxy
    traps, bounded length and depth, no toJSON) that is byte-identical to JSON.stringify for JSON-safe
    values under the bound; route every failure-message site in ts-utils conversion / validation /
    collections and the ts-json-base equivalents through it, leaving content uses alone; decide on a
    captureResult guard at the converter / validator boundary; classify every site; show regression
    tests red first; repo-wide rush test.
  shipped: >
    formatValueForMessage(value, options?) in ts-utils base, with IFormatValueForMessageOptions
    (maxLength 200, maxDepth 16, indent, style) and two default constants. Every failure-message
    JSON.stringify in both packages routed through it, plus the normalizers' unnormalizable-value
    messages. BaseConverter and GenericValidator wrap their function so a throw becomes a Failure
    carrying the error's message. Same pattern fixed in ts-extras conversion and ts-bcp47
    validationHelpers. stringifyLogValue made total. 240 of 333 hostile-input cases red before the
    fix; repo-wide rush test green with no downstream test text changed.
  diverged: >
    The sweep found the same throw in template-literal and String() failure sites (symbols,
    null-prototype objects, Proxies) that the brief's JSON.stringify count did not cover; they were
    fixed with an added style: 'string' option that keeps their text rather than switching them to
    the JSON rendering. The compatibility contract is stated as within maxLength and maxDepth, not
    length alone. The boundary guard was added (the brief left it open). Two c8 ignore directives on
    reachable failure lines were removed. Left open: the recursive ts-json-base JSON converters walk
    a cycle to stack exhaustion and fail with a very long message (TECH_DEBT P3), and
    classifyJsonValue still throws on a trapping Proxy.
  sourceLine: '**Shipped:** converter and validator failure messages can no longer throw. A new `formatValueForMessage` in `@fgv/ts-utils` renders any value — cyclic, `BigInt`, symbol, Proxy, throwing getter, huge or deep — as bounded text, and is byte-identical to `JSON.stringify` for JSON-safe values within its bounds. `BaseConverter` and `GenericValidator` additionally turn any throw from the function they wrap into a `Failure`, so `convert`, `validate` and `guard` never throw.'
  headline: >
    A converter or validator handed a cyclic, BigInt or Proxy value now fails instead of throwing,
    via a new formatValueForMessage that matches JSON.stringify for ordinary values.
keywords:
  - circular structure
  - cyclic input
  - JSON.stringify throws
  - failure message formatting
  - Result boundary
  - captureResult guard
  - BigInt
  - Proxy trap
  - throwing getter
