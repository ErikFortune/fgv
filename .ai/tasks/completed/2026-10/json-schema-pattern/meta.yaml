prs: [] # TBD: the orchestrator fills in the PR number
openPrs: []
opened: 2026-10-18
closed: 2026-10-18
summary:
  intended: >
    Split pattern by trust (user decision 1, 2026-10-18): a pattern option on the validated
    stringOptions (a RegExp or a source string, validated to compile with only wire-expressible
    flags), enforced and emitted; fromJson refusing pattern by default and admitting it through an
    injected patternValidator, the library never constructing a RegExp from untrusted input; a
    pattern row in the per-wire tables (pass where documented, fold elsewhere); an optional
    patternValidator on adaptMcpTools; pattern fixtures in the testbed wire probe; an RE2 default
    recorded as the next, separate package.
  shipped: >
    stringOptions({ pattern }) takes a host RegExp with exactly the u flag, read through the
    built-in accessors and matched with the built-in exec, emitted as its source, failing closed if
    re-initialised; the library constructs no RegExp at all. fromJson(json, { patternValidator })
    admits pattern on string nodes, with the default refusal unchanged and decided before the value
    is read (pinned with a RegExp spy recording zero calls). The tables pass pattern on Anthropic
    tools and Anthropic JSON outputs and fold it elsewhere, Gemini included (it documents the field but
    not its dialect or anchoring). adaptMcpTools takes
    patternValidator. The probe gains a host and a fromJson pattern fixture. FUTURE.md names
    ts-extras-re2 as next.
  diverged: >
    The trusted path takes a RegExp only, and only with exactly the u flag (no flag is refused too,
    since JSON Schema patterns are built with u), so nothing is recompiled; the source-string option
    and a recompiling copy were both rejected because they need new RegExp in the library. OpenAI
    documents pattern but the shared OpenAI/xAI table folds it, because xAI documents implicit
    anchoring, and review round 1 folded it on Gemini too, which documents neither dialect nor
    anchoring. pattern left FORBIDDEN_KEYWORDS for a per-conversion gate.
  sourceLine: '**Shipped:** `pattern`, split by trust — a host''s own `RegExp` through `stringOptions({ pattern })` is enforced and sent where the wire documents `pattern`, and `fromJson` admits a server''s `pattern` only through an injected `patternValidator`, so the library never constructs a `RegExp` at all.'
  headline: >
    JsonSchema pattern: a host's /…/u RegExp via stringOptions is enforced and sent where the wire
    documents pattern, and fromJson admits a server's pattern only through an injected
    patternValidator — the library never compiles one.
