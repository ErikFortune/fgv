summary:
  headline: '' # a proving ground and testbed sample, not a published capability
  intended: >
    Slice P1 of the agent-tasks plan is the credential-free public-API proving ground. It is a
    `samples/testbed` scenario, `agentTasks`, that walks the plan's nine-step journey through
    `ts-agent-tasks`' exports only, as a testable core plus a thin Node CLI bootstrap, alongside
    public contract/journey tests in the library. The run had to be deterministic: no credentials,
    network, downloads, weights, sleeps or wall-clock races. Any gap in the public surface was to be
    recorded as a finding, not routed around. The stream had two decisions to take: where each
    assertion lives, and what the scenario's core is. It was also to name, for each step, the
    assertion that fails on regression.
  shipped: >
    `samples/testbed/src/scenarios/agentTasks/` (scenario id `agent-tasks`, CLI-only) has these
    parts:
      - `world.ts` holds every simulation and host seam.
      - `journey.ts` is the testable core: nine steps plus the `7-cancel` and `7-uncertain`
        branches.
      - `report.ts` records each check as `{ observed, expected, passed }`.
      - `outbound.ts` captures the ai-assist request.
      - A thin `index.ts` bootstrap renders the result.
    In the library, `journey/publicJourney.test.ts` adds six contract tests through the public
    barrel. They pin the compositions no existing suite did.
    `samples/testbed/config/jest.setup.js` polyfills `structuredClone` for jsdom.
    Nothing in `libraries/ts-agent-tasks/src/packlets` changed.
    Three surface findings were routed to TECH_DEBT:
      - an undocumented `structuredClone` requirement;
      - query work observable only through an internal module;
      - no ai-assist per-call transport.
    Revert matrix: 10 rows, all red, against both suites.
    Tests: `ts-agent-tasks` has 2,407 tests at 100% coverage. `samples/testbed` has 609 tests, 31
    of them in `agentTasks`, with that scenario at 100%.
  diverged: >
    The assertion split has four homes, not the two the plan names:
      - existing library suites;
      - a new library `journey/` suite limited to six compositions;
      - the scenario's tests;
      - a CLI smoke.
    The whole journey is not duplicated across them.
    Two things shipped that the brief never mentioned: a `structuredClone` polyfill in the
    testbed's jsdom setup, and a flaky `ts-extras` KeyStore Argon2id test, found in the repo-wide
    run and routed.
    Three single-layer revert rows (P1-4, P1-5, P1-6) were equivalent mutants at first. The package
    guards each of those properties twice, so the rows were rewritten to remove every layer.
    Review hardened the scenario's own pass logic more than its use of the library:
      - Layer 1 found eight P2s.
      - Copilot found two highs in `report.ts`: non-finite values serialized as `null`, and a
        sentinel string.
      - About a third of the checks had been asserted only by the blanket `report.passed`. They are
        now pinned by value, with a 105-check guard.
    Both change files are `none`.
    The brief's advice to trigger Copilot with a comment did not hold: the bare comment did
    nothing, and the API request worked. The loop stopped at 3 rounds (7 → 2 → 0 findings).
  sourceLine: '**Shipped:** A credential-free `samples/testbed` scenario now drives `@fgv/ts-agent-tasks` through all nine steps of the plan''s journey using only the package''s exports — every claim a structured check with the value it observed, and library contract tests pinning the compositions no existing suite did.'
