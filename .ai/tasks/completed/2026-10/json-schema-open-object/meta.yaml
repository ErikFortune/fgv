id: json-schema-open-object
status: shipped
packages: ['@fgv/ts-json-base']
prs: [] # <PR>: filled by the orchestrator when it opens the PR — the worker does not know the number
openPrs: []
opened: 2026-10-03
closed: 2026-10-03
summary:
  intended: >
    Make what JsonSchema.object emits on the wire agree with what it converts for open objects
    (PersonAIlity fgv-ask #679): additionalProperties: true, and every fromJson object without
    additionalProperties: false, advertised an open object while the converter silently dropped every
    undeclared key, so an open MCP argument reached the tool as {}. Choose between pass-through,
    closing the wire, refusing open nodes in fromJson, or a combination, and verify five stated beliefs.
  shipped: >
    Open objects convert declared properties as before and carry every undeclared key through as a
    validated JsonValue; a non-object input is refused instead of becoming {}. The wire schema is
    unchanged (absent keyword = open, false = closed); the converter now honours it. Additive typing:
    OpenObjectStatic<P> and two object() overloads keyed on a literal additionalProperties: true. No
    consumer outside ts-json-base needed a test change.
  diverged: >
    Belief 4 was wrong: schema-valued additionalProperties is refused by fromJson before the
    !== false mapping. The brief missed a second symptom (an open object converted 42, strings and
    arrays to {}), fixed here. Emitting an explicit additionalProperties: true, as the requester
    proposed, was built and reverted: Anthropic JSON outputs reject a present non-false keyword. A
    Converters.jsonObject __proto__ fix was built and reverted after a repo-wide run showed
    ts-agent-tasks pins the existing behaviour; deferred to TECH_DEBT. An object that declares
    properties and omits additionalProperties now keeps stray keys rather than dropping them.
  sourceLine: '**Shipped:** an open `JsonSchema` object now keeps what its wire schema admits — undeclared keys reach the caller as validated `JsonValue` instead of being silently dropped.'
  headline: >
    An open JsonSchema object — additionalProperties: true, or an MCP schema that leaves it out — now
    passes undeclared keys through validated instead of silently dropping them.
