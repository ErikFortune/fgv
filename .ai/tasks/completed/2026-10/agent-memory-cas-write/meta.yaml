summary:
  intended: >
    personaility#701. put(record, { expected?: seq | 'absent' }) returning a DetailedResult with a
    classified IMemoryWriteFailure ('conflict' carrying the current seq; 'rejected' | 'invalid' |
    'io'), the same expected on delete, checked inside the write lock after address resolution and
    before dedup on both layouts; a persisted seq high-water mark, advanced before the seq it covers
    is used, to close the cross-restart ABA hole; ingest merge-into passing expected from its
    snapshot and reporting a conflict per candidate without retrying; in-process guarantee only.
  shipped: >
    All of it. writeFailure.ts (public types + allMemoryWriteFailureCodes), storeWriteCondition.ts
    (WriteRefusal carried as a value, settleWrite classifying any pipeline failure as io), storeSeq.ts
    (memory-store.seq.json reservation ceiling in blocks of 64, written through the record writer;
    missing file derives from disk, unreadable fails the open). The flat path now reads the same-id
    record before content dedup. Ingest merge-into expects the entity's current snapshot seq and
    carries its own in-pass writes forward; a conflict is disposition 'conflict'. Observation
    fan-out and merge helpers moved out to keep fileTreeMemoryStore.ts at 1972 lines.
  diverged: >
    Added a 'not-found' code and typed delete's expected as number only. The high-water mark is a
    block reservation, so seq is no longer dense across a reopen (one existing test pinned density).
    The versioned merge expectation is the entity's current version, not the verdict target's seq,
    and a pass's own merges are carried forward so two candidates on one target do not conflict;
    neither was in the brief. Extending the open-time sweep to the root was tried and reverted. The
    change is not strictly implementers-only: plain-Result chaining callers need .asResult.
  sourceLine: '**Shipped:** `FileTreeMemoryStore.put` and `delete` take an optional `expected` seq, checked under the write lock before any dedup, and a persisted seq high-water mark guarantees no seq is ever issued twice — so a read-modify-write can no longer silently lose a concurrent same-instance update.'
  headline: >
    A memory read-modify-write can no longer silently lose a concurrent update: FileTreeMemoryStore
    put and delete take an expected seq and fail with a conflict, and a seq is never re-issued, even
    across a restart.
