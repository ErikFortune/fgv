summary:
  headline: '' # one line per capability, not per stream: this slice's capability is carried by agent-tasks-i1a's headline
  intended: >
    Slice I1b of four in plan § I1. Extend the `tools` packlet with tracked-task and reassignment
    mutation tools that are available only on an explicit host opt-in. Default construction must
    still produce exactly I1a's two read-only tools. The central decision is how the model supplies
    `expectedRevision`, which I1a never exposed. The options were to widen the read surface, to have
    the tool read and then write, or to refuse the shape; the choice had to be argued against the
    other two. Further requirements: the model cannot acquire authority, mint an `operationId`,
    change a source binding or set external lifecycle. Surplus fields fail. Authority is asked live,
    and opting in is not authorizing. A writer's answer is converted the way a view's answer is.
    Every refusal's disclosure and every check-then-act window are to be enumerated. The outbound
    capture test must cover both configurations. The mutation tool names must not collide with
    I1c's generated command tool names. Revert rows must run on final source.
  shipped: >
    `createTaskTools` gained `mutations?: { writer, environment, enable }`. `'tracked'` adds
    `task_create` and `task_update`, and `'reassign'` adds `task_reassign`. `writer` must be the very
    object passed as `view`, and unknown groups are refused. Without the option, the tools are
    exactly `task_query` and `task_inspect`, asserted by name in the factory, through the package
    root, and in the captured outbound body. `task_inspect` now returns `revision`, and the change
    tools require it back as `expectedRevision`; the writer refuses a stale one. The tool mints
    every `operationId` and a new task's id through the host environment, and the closed schemas
    refuse either from the model. `writerAnswers.ts` strictly converts each receipt and ties its
    task, operation, revision and reassigned party to the request. The model is told only
    `{ taskId, revision, disposition }`. Unknown outcomes are reported as unknown, and an unknown
    creation names its minted id. Nothing in `broker/` or `storage/` changed. Revert matrix: 31 rows
    (I1b-1…I1b-24 plus seven re-pointed I1a rows) with 74 red tests, 0 UNVERIFIED and 0 rows at
    `0 red`. Package suite: 91 suites, 2,114 passed at 100 % with zero `c8 ignore`. Layer 1 found
    no P1 and three P2s, all resolved. The Copilot loop stopped at 2 rounds on diminishing returns.
  diverged: >
    The model is told less than the working design planned. state.md's design returned
    `previous` / `current` on a reassignment. Layer-1 P2-1 found that `previous` came from the
    unprojected envelope, so both were removed. The slice minted the new task's id as well as the
    `operationId`, which the brief did not ask for, because a model-chosen id could probe for hidden
    tasks. I1a's failure path moved to a shared `toolSupport.ts`, with per-family wording, and
    I1a's `not-found-or-denied` / `conflict` texts were reworded. Seven I1a revert rows were
    re-pointed. The brief asked what reserves the tool-name namespace; I1b fixed the five names and
    routed enforcement to I1c rather than building it. The integer-range trigger fired
    (`expectedRevision`, progress amounts) but was not acted on, because it is a `ts-json-base`
    extension outside the slice's surface. The orchestrator's gating re-run found a hole in the
    matrix runner (a `? red` row with no failure count passed and exited 0), and it was fixed here.
    The Copilot loop ran 2 rounds, not the "at least" five the brief predicted.
  sourceLine: '**Shipped:** A host can opt a model into creating, updating and reassigning agent tasks — task_create, task_update and task_reassign beside the read tools, over the same principal-bound writer — authorized per call, with every id minted by the tool and every receipt checked before the model sees it.'
keywords:
  - model mutation tools
  - opt-in disabled by default
  - expectedRevision on the wire
  - optimistic concurrency for model writes
  - minted operation id
  - minted task id
  - writer receipt conversion
  - unknown outcome reporting
  - refusal disclosure
  - writer equals view
  - task_create task_update task_reassign
  - mutation matrix runner hole
