summary:
  intended: >
    Close two small PersonAIlity asks as a chore batch: rewrite the IProvenance.derivedFrom docstring in
    ts-agent-memory to describe provenance rather than a followable back-link (personaility#670), and add a
    weighted pick to ts-random as a pure function of a unit float plus a generator method, with edge rules
    and a walk that keeps a consumer's stored hash-derived draws stable (personaility#669).
  shipped: >
    The derivedFrom docstring now says the field is provenance that keeps naming a withdrawn source and may
    name a superseded version, with the ingest sourceId doc and a stale FUTURE.md line corrected to match.
    ts-random gained IWeightedCandidate, pickWeightedAt and PseudoRandomGenerator.pickWeighted, with one
    named test per edge rule, fixed stability pins, an overflow rescale, and a mutation-checked test that
    ordinary weights are never rescaled.
  diverged: >
    The requester's "queryable" wording was not adopted: no retrieval axis indexes derivedFrom, so the
    docstring says selecting by it takes a whole-record filter predicate. The stale claim the brief expected
    in CAPABILITIES.md or the README was not there; the one contradiction found was in docs/FUTURE.md.
  sourceLine: "**Shipped:** `@fgv/ts-random` can make a weighted random choice, either from a generator or as a pure function of a unit float in `[0, 1]`, so a hash-derived choice is stable; `IProvenance.derivedFrom` is now documented as provenance, not a live link."
