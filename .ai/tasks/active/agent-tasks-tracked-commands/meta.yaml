summary:
  intended: >
    A designed fifth I1 slice, authorized proactively: give fgv.tracked@1's eleven transitions
    registered JsonSchema parameter schemas on trackedTaskDescriptor(), so I1c's generator can offer
    them as command tools with no change to packlets/tools/. Decide between two validators with
    agreement as a fixture obligation (register schemas; _prepare keeps converting through
    trackedCommand) and unifying _prepare onto the registered handle. Register all eleven and leave
    the choice to the host's enable list; document set-attention's forgeable references and
    succeed/fail asserting outcomes; prove a lifecycle move end to end through the real broker and
    task_inspect; confirm no new disclosure channel; remove the fgv.tracked@1 TECH_DEBT entry; add
    the slice to the implementation plan. Must not touch packlets/tools/ or fixedTaskToolNames (I1d's).
  shipped: >
    trackedTaskDescriptor() registers all eleven trackedTaskCommandNames as ITaskCommandHandles over
    JsonSchema schemas held in a total Record, so a twelfth name does not compile without a schema;
    a test pins the registered names to the vocabulary in order. Option 1 taken: _prepare keeps
    converting through trackedCommand, which stays authoritative. Agreement fixtures pin both
    validators' verdicts on 71 values: 23 both accept, 28 both refuse, 19 only the schema accepts,
    1 only the converter accepts. Handles register idempotency 'none' and conditional false, inert on
    native paths. End to end through a real broker and a captured Anthropic model turn, each command
    moves the task and task_inspect reports it; a stale revision and an unavailable transition read
    as I1c's fixed conflict line naming no status. Hosts are told that references (six of eleven
    commands) are accepted on syntax alone and that succeed/fail/cancel assert a final state.
    Command-handle and descriptor TSDoc now scope "the broker validates/encodes" to externally
    executed kinds. Revert matrix: 11 rows (TC-1…TC-11), 0 UNVERIFIED. Copilot loop stopped at 4
    rounds.
  diverged: >
    The brief framed unification (option 2) as "one authority, no obligation to maintain"; the stream
    found it cannot deliver that — the JsonSchema subset cannot state the converter's bounds, so a
    unified _prepare would still run trackedCommand behind the schema, would narrow what the broker
    accepts for host callers, and would couple fgv.task-list@1 to registration. The brief named
    set-attention as the reference hazard; the stream found references in six of the eleven commands
    (every reason's attention and every outcome's artifacts). The fixtures surfaced a disagreement
    the brief did not anticipate — the converter coerces a numeric-string amount the schema refuses —
    and a ts-utils quirk (an object converter with no fields converts null to {}). The first
    registration used idempotency 'source-key' and conditional true; layer 1 reversed that to the
    inert values. Copilot round 2 found that registering native handles made public command-handle
    TSDoc false (the broker never calls a native handle's validate), so doc-only edits landed in
    types/registry.ts and types/commands.ts, which the brief did not list. Gemini acceptance of an
    empty nested object and the wrong "do not send it again" line for converter-only refusals were
    left open and routed, the latter to I1d, which did not take it.
  sourceLine: '**Shipped:** A model can now move a tracked task''s lifecycle — `fgv.tracked@1` registers all eleven of its transitions with parameter schemas, so a host offers any of them as typed command tools, one by one, while the broker''s own converter stays the authority on what it accepts.'
