summary:
  intended: >
    PR 2 of slice T8, closing it: first a designed extraction from storage/repository.ts (7 lines
    of max-lines headroom) as its own green commit with the API report unchanged; then the A3
    saturation journeys for every section 8.6 dimension with exact used/reserved transfers at every
    crash point (including pending activation and acknowledged-but-unpruned), the transient vs
    lifetime capacity distinction, lifetime acknowledgement exhaustion on one and across many closed
    subscriptions, and the rest of A3's list; the frozen M1 harness run on this implementation
    before any profile change, without editing its manifest; and the design authority's six
    profile changes (reserve the derived 37,417 B update maximum; resident-payload-bytes 64 -> 384
    MiB; non-archived-tasks stays 1,000 as now reachable; maxConsumerRecordBytes 8 -> 32 MiB;
    per-subscription ids stay 50,000; maxUpdateBytes stays 64 KiB), documented at every site, with
    the TECH_DEBT capacity entry closed.
  shipped: >
    Phase 0 extracted storage/committedFiles.ts (repository.ts 1993 -> 1808 lines; api.md
    byte-identical) as its own green commit. M1 ran on 60db3e8d before the profile change, after a
    disclosed one-line harness seed correction; all four cohorts passed (fixture released 99.8%;
    archived 1k->10k increment ratio 0.138; terminal archiving 900 released 5.25 of 5.15 MiB; peak
    open 16.39 MiB against a 33.17 MiB bound). New public maximumUpdateBytes(profile); closeout,
    first-resolution and settlement reservations use it; resident-payload-bytes 384 MiB;
    maxConsumerRecordBytes and the per-record record-bytes ceiling 32 MiB. Saturation suites
    (saturation.test.ts 53 tests, lifetime.test.ts 13) saturate all eleven section 8.6 dimensions and
    run the journey with exact transfers at every write boundary and the three activation writes;
    the end state keeps 14 acknowledgement/disposition ids and 6 operations as lifetime charges.
    reclaimableByCleanup made non-static. The antagonist's two HIGHs fixed (raiseCapacityLimits
    could outgrow existing reservations; a landed-but-not-live current activation silently missed
    commits). 1,790 tests in 72 suites on f69e1c08, 100%, zero c8 ignore; perf/mutationMatrix.js
    100 rows: 93 red, 6 stale on the base, 1 zero-red by an earlier disposition. Copilot stopped at 4
    rounds.
  diverged: >
    The decision's premise did not hold once built: the default profile refuses the 537th plain
    registration on logical-bytes, so non-archived-tasks 1,000 is not reachable; put to the user, who
    chose to ship the six changes and document 536 (P3 opened). Change 4 needed a seventh number:
    record-bytes was raised 8 -> 32 MiB because recordLimitFor capped the consumer record at it. (d)
    was applied to first resolution, which the brief did not name, but not to the current-baseline
    charge, which is already actual bytes. M1 neither confirms nor refutes 384 MiB (no frozen cohort
    holds owed payload near that budget); it confirms structure only. The frozen M1 harness needed a
    one-line seed fix to run at all after T8 PR 1. Not in the brief: reclaimableByCleanup was static
    per dimension and misreported a lifetime dimension held as reservation; the antagonist's H2 fix
    changed T7 code (frozen landed-but-not-live activations); stored claims minted before (d) fail at
    open, disclosed as BREAKING with no migration. The stop-blocker clause of A3 is proven only for
    unsettled commands; the stop latch is T9's.
  sourceLine: '**Shipped:** Agent-task capacity is qualified end to end: every §8.6 dimension saturates, refuses growth and still completes, drains, archives and reopens with exact transfers at every crash point; reservations use an update''s derived 37,417-byte maximum; and the default profile says what it admits — 536 plain registrations, bound by logical bytes.'
