summary:
  intended: >
    Slice T6 of the agent-tasks plan: source adapters, commands and reconciliation — an external
    helper with typed projections and commands, a source revision comparator, optional push hints,
    explicit paged reconciliation and recovery, source cursor storage, native/external operation
    receipts, safe handling of uncertain outcomes, and deterministic controllable and
    observation-only test sources that really apply commands. Bar: the source owns execution truth
    and the broker never sets external status optimistically; accepted differs from applied; the
    source cursor advances only after committed projections; uncertain non-idempotent dispatch is
    held, not replayed; restart has no external side effects. Also: confirm the § 8.6
    source-history spelling and correct the stale one, build against the 2026-09-24 "no
    executor-payload dereference" decision, enumerate every check-then-act / observe-then-advance
    window, and reserve command result and settlement before dispatch under A3 without silently
    worsening the 146-task ceiling.
  shipped: >
    ITaskSource (history, compare, observe, reconcile, dispatch, recover, optional lookupCommand)
    with SourceRead, ISourceReconcilePage (completeness plus coverage), SourceCommandResult
    (rejected / accepted / applied / indeterminate / key-expired) and SourceCommandLookup, with
    converters; ExternalTaskSource.create, whose callback failures or throws become
    source-unavailable. Broker host operations observe, hint, reconcile, recover and
    extendReplayEnvelope; external execute dispatches through the source, and resolveCommands pumps
    uncertain commands. Storage gained a per-source checkpoint record (record-first, then
    manifest-live), the unsettledCommands index, accepted-operation-settlement and
    admitted-source-replay claims, and a health-only observation commit at an unchanged revision.
    SimulatedExecutor test sources (controllable and observation-only); reverting its _apply to a
    no-op turns 18 tests red. Twelve ordering windows (W1–W12) are named with their re-checks.
    Source-history spelling confirmed as § 8.6's 'observed-state' | 'source-replay'. The
    no-dereference decision was built against, and a 200 KiB executor payload never appears in any
    record. Registration baseline unchanged at 448 KiB (ceiling 146); each in-flight external
    command reserves a further 64 KiB (128 at one per task). 1,373 tests, 100%, zero c8 ignore;
    38 protections reverted on the final source, all red.
  diverged: >
    The stale spelling was not in the plan's § 5, as the brief said, but in development-design.md
    § 5 (plus a stray copy in multi-agent-chat-adoption.md). Both were corrected there; the plan's
    diff carries the dereference decision record and the T6 status line. The brief preferred
    deciding over revising: T6 revised one T1 member (RecoveryResult.unrecoverable now carries the
    source's projection, which is not persisted) and added a persisted field
    (IStoredCommandOperation.awaiting?, additive, so old records read unchanged). It omitted
    ITaskSource.capabilities() and deferred it to T9. The dereference decision was confirmed by
    evidence rather than pushed back on. The six-round Copilot loop changed behaviour well beyond
    the brief: archive is refused while any command is unsettled or awaiting a feed revision; a
    contradicting or contract-violating applied answer stays indeterminate with its reservation
    held; a page naming another source's binding is a contract violation before anything applies;
    feed order is carried across a pass's pages and keyed canonically; awaiting carries a digest of
    the answer's execution projection; a task holding a replay claim commits projections only in
    feed mode; a duplicate feed revision is a no-op rather than a stuck cursor. A post-layer-1 self-audit of the windows table found W4 (the pump's resend was unfenced).
    New capacity arithmetic lowers the effective ceiling to 128 with one in-flight command per task.
  sourceLine: '**Shipped:** External task sources — a typed `ExternalTaskSource` helper and the `ITaskSource` contract, observations ordered by the source''s own revision comparator, paged reconciliation whose cursor advances only after the page''s projections commit, recovery over every recovery outcome, and external commands that reserve their settlement before dispatch, record accepted apart from applied, and hold an uncertain non-idempotent command rather than resend it.'
