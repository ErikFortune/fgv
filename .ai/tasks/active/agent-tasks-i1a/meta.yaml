summary:
  intended: >
    Slice I1a, the first of four that plan § I1 split up front. Create the `tools` packlet: a
    factory producing `@fgv/ts-extras` `IAiClientTool`s over an `IBoundTaskView`, with a
    read-only surface (`query` and `inspect`) only, bounded outputs by default rather than by
    opt-in, and schema revalidation inside `execute`. It must not repeat the ts-agent-memory
    precedent's permissive full-body fallback, and should prefer T2's `TaskContextRenderer` for
    bounding. Decide what a failing host projector does. Allow no principal, scope or consumer
    override. Surplus fields fail. Authority is asked per call. Evidence required: an outbound
    request capture through ai-assist, `JsonSchema.toJson` wire assertions, proof that no
    `IBoundTaskWriter` member is referenced, and revert rows run on final source. Add the
    `@fgv/ts-extras` dependency.
  shipped: >
    `createTaskTools({ view, renderer?, budget? })` returns exactly two tools, `task_query` and
    `task_inspect`, over an `IBoundTaskView`. Tasks reach the model only as `TaskContextRenderer`
    text. Page items the text omitted or abbreviated are named by id, so paging skips nothing
    unannounced. Details are returned only within `maxDetailsChars`, and a `limit` above
    `maxItems` is refused, not clamped. A failing projector fails the call with no partial page.
    The model is told a failure's code and a fixed description, never host text, which goes to an
    optional `logger`. Every field of a view's answer is converted (`viewAnswers.ts`) before
    anything reads it. The renderer was extended to accept an unresolved reference without a
    binding, via a new separate converter (`contextUnresolvedReference`), leaving the storage
    converter unchanged. Outbound capture covers Anthropic, OpenAI Responses and Gemini, plus a
    no-tools control. Neither `IBoundTaskWriter` nor `inspectStop` is referenced in the packlet,
    and a recording proxy shows exactly `{inspect, query}` touched. Revert matrix on final source:
    31 rows with 53 red tests and 0 UNVERIFIED. The package suite ran 2,068 tests passing at
    100 % with zero `c8 ignore`. Layer 1 found no P1. The Copilot loop stopped at 5 rounds on
    diminishing returns.
  diverged: >
    Bounding the failure path went further than the brief framed it. The brief and layer 1
    treated it as a matter of length (truncate). Copilot round 1 showed truncation still disclosed
    host text: a connection string reached the model. So view, projector and thrown failures now
    reach the model only as a code plus a fixed description, and a `logger` option was added to
    the factory. Rounds 2–4 each found another view-answer field reaching the model unchecked
    (`issues`, `nextCursor`, `detail.code`, `completeness` / `freshness`, `commands` /
    `archived`, `state`, page length). Round 4 fixed the cause rather than the fields: a strict
    converter for the whole view answer, `viewAnswers.ts`, which the brief never mentioned. The
    renderer did not fit a bound view's binding-less unresolved references, so it was extended
    outside the `tools` packlet, still within the package. The loop ran five rounds, against the
    brief's expectation of a shorter loop than T9's. On Gemini, schema closure is enforced by
    validation only, because that dialect drops `additionalProperties`. Two revert rows were
    wrong on their first run and were corrected: I1a-21 was red for the wrong reason, and
    I1a-18's mutant was a no-op.
  sourceLine: '**Shipped:** A model can be handed two read-only tools over the agent tasks one principal may see — task_query and task_inspect, ai-assist client tools over a bound view — whose output is bounded by default, never by opt-in.'
